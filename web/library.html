<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTGA Stats · Bibliothek</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0e18">
<link rel="stylesheet" href="app.css">
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</head>
<body>
<script>
App.load().then(async (D) => {
  const A = App, FI = A.FI, T = A.t;
  A.shell("library.html", `
    <div class="topbar"><div><h1>${T("Kartenbibliothek")}</h1><div class="sub" id="sub">${T("Alle Karten des Spiels mit Besitzstand")}</div></div>
      <div class="right filters">
        <div id="f-set"></div>
        <div id="f-rar"></div>
        <div id="f-type"></div>
        <div class="seg colors" id="f-colors" title="${T("Farbe")}">${[["1", "w", "Weiß"], ["2", "u", "Blau"], ["3", "b", "Schwarz"], ["4", "r", "Rot"], ["5", "g", "Grün"], ["0", "c", "Farblos"]].map(([v, k, t]) => `<button data-v="${v}" title="${T(t)}">${A.manaSymbol(k)}</button>`).join("")}</div>
        <div id="f-own"></div>
        <div id="f-sort"></div>
        <button type="button" class="reset" id="f-reset" title="${T("Filter und Sortierung zurücksetzen")}">${A.FI.reset}</button>
      </div></div>
    <div class="lib-bar"><div id="f-q"></div><span class="count" id="count">${T("lade …")}</span><div id="f-size"></div></div>
    <div class="cards lib" id="grid">${Array.from({ length: 36 }, () => '<div class="c sk"></div>').join("")}</div>
    <div class="empty" id="more"></div>
  `);
  let all = [];
  try {
    const [cards] = await Promise.all([A.getJson("api/cards", 60000), A.loadSets()]);
    all = cards.cards;
  } catch (e) {
    A.$("#grid").innerHTML = "";
    A.$("#count").textContent = T("Bibliothek nicht verfügbar. Läuft der Watcher (Server)?");
    return;
  }
  // [grpId, name, set, nr, rarity, colors, types, artId, cmc, owned, cost, isToken, isRebalanced, isPrimary, frameFlags, power, toughness, text, typeLine]
  const base = all.filter((c) => !c[11] && c[13]);
  const sets = [...new Set(base.map((c) => c[2]))].sort();
  const RAR = { 1: "Standardland", 2: "Common", 3: "Uncommon", 4: "Rare", 5: "Mythic", 0: "Token" };

  // Nutzung aus den lokalen Daten (über alle Drucke, nach Kartennamen): Siege, gespielte Matches, Decks
  const use = new Map();
  const u = (name) => { if (!use.has(name)) use.set(name, { w: 0, played: 0, casts: 0, decks: 0, m: new Set() }); return use.get(name); };
  for (const m of D.matches || []) for (const [g, n] of m.played || []) {
    const x = u(A.cardName(g));
    if (!x.m.has(m.matchId)) { x.m.add(m.matchId); x.played++; if (m.result === "Sieg") x.w++; }
    x.casts += n;
  }
  for (const d of D.decks || []) { const names = new Set(); for (const z of Object.values(d.zones || {})) for (const [g] of z) names.add(A.cardName(g)); for (const n of names) u(n).decks++; }
  const useOf = (c) => use.get(c[1]) || { w: 0, played: 0, casts: 0, decks: 0 };

  // Filter: Suche, Set, Seltenheit, Typ, Farben, Besitz, Sortierung
  const params = new URLSearchParams(location.search);
  const rerender = () => render();
  const fQ = A.searchBox(A.$("#f-q"), { placeholder: T("Name suchen"), value: params.get("q") || "", onInput: A.debounce(rerender, 160) });
  const fSet = A.dropdown(A.$("#f-set"), { icon: FI.set, title: T("Set"), searchable: true, onChange: rerender, items: [{ v: "", label: T("Alle Sets"), short: T("Set"), icon: FI.set }, ...sets.map((s) => ({ v: s, label: s, short: s, title: A.setName(s), search: A.setName(s), icon: A.setIcon(s) }))] });
  A.$("#f-set").classList.add("sets");
  const gem = (c) => FI.gem(c);
  const fRar = A.dropdown(A.$("#f-rar"), { title: T("Seltenheit"), onChange: rerender, items: [
    { v: "", label: T("Alle Seltenheiten"), short: T("Seltenheit"), icon: gem("#8d95a8") }, { v: "2", label: "Common", icon: gem("#1f242e") }, { v: "3", label: "Uncommon", icon: gem("#b9c4cc") },
    { v: "4", label: "Rare", icon: gem("#e0b654") }, { v: "5", label: "Mythic", icon: gem("#e8632a") }, { v: "1", label: T("Standardland"), icon: gem("#6e5a3c") }] });
  const fType = A.dropdown(A.$("#f-type"), { title: T("Kartentyp"), onChange: rerender, items: [
    { v: "", label: T("Alle Typen"), short: T("Typ"), icon: FI.all }, { v: "2", label: T("Kreatur"), icon: FI.creature }, { v: "4", label: T("Spontanzauber"), icon: FI.instant }, { v: "10", label: T("Hexerei"), icon: FI.sorcery },
    { v: "3", label: T("Verzauberung"), icon: FI.enchantment }, { v: "1", label: T("Artefakt"), icon: FI.artifact }, { v: "8", label: T("Planeswalker"), icon: FI.planeswalker }, { v: "5", label: T("Land"), icon: FI.land }, { v: "14", label: T("Schlacht"), icon: FI.battle }] });
  const fOwn = A.dropdown(A.$("#f-own"), { title: T("Besitz"), value: params.get("own") || "1", defaultValue: "1", onChange: rerender, items: [
    { v: "1", label: T("Im Besitz"), icon: FI.check }, { v: "", label: T("Alle Karten"), short: T("Alle"), icon: FI.all }, { v: "0", label: T("Fehlende"), icon: FI.x }] });
  const fSort = A.dropdown(A.$("#f-sort"), { title: T("Sortierung"), value: params.get("sort") || "name", onChange: rerender, items: [
    { v: "name", label: T("Name A–Z"), short: T("Name"), icon: FI.az }, { v: "wins", label: T("Meiste Siege"), short: T("Siege"), icon: FI.trophy }, { v: "played", label: T("Meist gespielt"), short: T("Gespielt"), icon: FI.play },
    { v: "decks", label: T("Meist in Decks"), short: T("Decks"), icon: FI.deck }, { v: "owned", label: T("Meiste Exemplare"), short: T("Exemplare"), icon: FI.copies }, { v: "cmc", label: T("Manawert"), short: T("Mana"), icon: FI.mana },
    { v: "rarity", label: T("Seltenheit"), icon: gem("#e0b654") }, { v: "set", label: T("Set und Nummer"), short: T("Set"), icon: FI.set }] });
  A.sizeSlider(A.$("#f-size"), A.$("#grid"));
  let colors = new Set(), page = 0;
  const PAGE = 120;
  A.$$("#f-colors button").forEach((b) => b.addEventListener("click", () => { const v = b.dataset.v; if (colors.has(v)) colors.delete(v); else colors.add(v); b.classList.toggle("on", colors.has(v)); render(); }));

  // Kartendaten für Kacheln in das globale Wörterbuch einspeisen
  const dict = {};
  for (const c of all) dict[c[0]] = [c[1], c[2], c[3], RAR[c[4]] || "", c[11], c[7], c[5], c[6], c[14] || "", c[15] || "", c[16] || "", c[17] || "", c[18] || "", c[10] || ""];

  function filtered() {
    const q = fQ.value.trim().toLowerCase(), own = fOwn.value, s = fSort.value;
    let list = base.filter((c) => {
      if (q && !c[1].toLowerCase().includes(q)) return false;
      if (fSet.value && c[2] !== fSet.value) return false;
      if (fRar.value && String(c[4]) !== fRar.value) return false;
      if (fType.value && !String(c[6]).split(",").includes(fType.value)) return false;
      if (colors.size) {
        const cc = String(c[5]).split(",").filter(Boolean);
        if (colors.has("0") && cc.length) return false;
        if ([...colors].some((v) => v !== "0" && !cc.includes(v))) return false;
      }
      if (own === "1" && !c[9]) return false;
      if (own === "0" && c[9]) return false;
      return true;
    });
    const byName = (a, b) => a[1].localeCompare(b[1], "en");
    // Bei Nutzungs-Sortierung nur ein Druck je Kartenname (der mit den meisten Exemplaren)
    if (s === "wins" || s === "played" || s === "decks") {
      const best = new Map();
      for (const c of list) { const p = best.get(c[1]); if (!p || c[9] > p[9]) best.set(c[1], c); }
      list = [...best.values()];
    }
    list.sort((a, b) => {
      if (s === "wins") { const x = useOf(a), y = useOf(b); return (y.w - x.w) || (y.played - x.played) || byName(a, b); }
      if (s === "played") { const x = useOf(a), y = useOf(b); return (y.played - x.played) || (y.casts - x.casts) || byName(a, b); }
      if (s === "decks") { const x = useOf(a), y = useOf(b); return (y.decks - x.decks) || (y.played - x.played) || byName(a, b); }
      if (s === "set") return a[2].localeCompare(b[2]) || String(a[3]).localeCompare(String(b[3]), undefined, { numeric: true });
      if (s === "cmc") return (a[8] - b[8]) || byName(a, b);
      if (s === "rarity") return (b[4] - a[4]) || byName(a, b);
      if (s === "owned") return (b[9] - a[9]) || byName(a, b);
      return byName(a, b);
    });
    return list;
  }
  let current = [];
  A.$("#f-reset").addEventListener("click", () => {
    fQ.value = ""; fQ.dispatchEvent(new Event("input")); fSet.value = ""; fRar.value = ""; fType.value = ""; fOwn.value = "1"; fSort.value = "name";
    colors.clear(); A.$$("#f-colors button").forEach((b) => b.classList.remove("on")); render();
  });
  function render() {
    current = filtered(); page = 0;
    A.$("#f-reset").classList.toggle("show", !!(fQ.value || fSet.value || fRar.value || fType.value || colors.size || fOwn.value !== "1" || fSort.value !== "name"));
    const owned = current.filter((c) => c[9]).length, copies = current.reduce((s, c) => s + c[9], 0);
    A.$("#count").textContent = T("{n} Karten · {o} im Besitz ({c} Exemplare) · {s} Sets", { n: current.length, o: owned, c: copies, s: sets.length });
    A.$("#grid").innerHTML = "";
    const p = new URLSearchParams();
    if (fQ.value) p.set("q", fQ.value); if (fOwn.value !== "1") p.set("own", fOwn.value); if (fSort.value !== "name") p.set("sort", fSort.value);
    history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : ""));
    more();
  }
  function more() {
    const slice = current.slice(page * PAGE, (page + 1) * PAGE);
    page++;
    const s = fSort.value;
    const sx = (c) => { const x = useOf(c); if (s === "wins") return x.played ? `<span class="sx" title="${T("{w} Siege in {n} Matches", { w: x.w, n: x.played })}">${FI.trophy}${x.w}</span>` : ""; if (s === "played") return x.played ? `<span class="sx" title="${T("{n} Matches, {c}× gewirkt", { n: x.played, c: x.casts })}">${FI.play}${x.played}</span>` : ""; if (s === "decks") return x.decks ? `<span class="sx" title="${T("in {n} Decks", { n: x.decks })}">${FI.deck}${x.decks}</span>` : ""; return ""; };
    A.$("#grid").insertAdjacentHTML("beforeend", slice.map((c) => A.cardTile(c[0], { dict, qty: 0, extra: `<span class="own ${c[9] ? "has" : ""}">${c[9] ? c[9] + "×" : "–"}</span><span class="cost">${A.esc(c[10])}</span>${sx(c)}`, cls: c[9] ? "" : "missing" })).join(""));
    A.Art.bind(A.$("#grid"));
    A.hoverPreview(A.$("#grid"), dict);
    A.cardLinks(A.$("#grid"), dict);
    A.$("#more").innerHTML = page * PAGE < current.length ? `<button id="b-more">${T("Weitere {n} Karten laden ({r} übrig)", { n: Math.min(PAGE, current.length - page * PAGE), r: current.length - page * PAGE })}</button>` : (current.length ? "" : T("Keine Karten gefunden"));
    const b = A.$("#b-more"); if (b) b.addEventListener("click", more);
  }
  // automatisch nachladen beim Scrollen
  const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting) && page * PAGE < current.length) more(); });
  io.observe(A.$("#more"));
  render();
});
</script>
</body>
</html>
