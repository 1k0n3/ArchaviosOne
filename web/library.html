<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTGA Stats · Bibliothek</title>
<link rel="stylesheet" href="app.css">
<script src="data.js"></script>
<script src="app.js"></script>
</head>
<body>
<script>
App.load().then(async (D) => {
  const A = App, FI = A.FI;
  A.shell("library.html", `
    <div class="topbar"><div><h1>Kartenbibliothek</h1><div class="sub" id="count">lade …</div></div>
      <div class="right filters">
        <div id="f-q"></div>
        <div id="f-set"></div>
        <div id="f-rar"></div>
        <div id="f-type"></div>
        <div class="seg colors" id="f-colors" title="Farbe">${[["1", "w", "Weiß"], ["2", "u", "Blau"], ["3", "b", "Schwarz"], ["4", "r", "Rot"], ["5", "g", "Grün"], ["0", "c", "Farblos"]].map(([v, k, t]) => `<button data-v="${v}" title="${t}">${A.manaSymbol(k)}</button>`).join("")}</div>
        <div id="f-own"></div>
        <div id="f-sort"></div>
      </div></div>
    <div class="lib-stats" id="libstats"></div>
    <div class="cards lib" id="grid">${Array.from({ length: 36 }, () => '<div class="c sk"></div>').join("")}</div>
    <div class="empty" id="more"></div>
  `);
  let all = [];
  try {
    const [cards] = await Promise.all([A.getJson("api/cards", 60000), A.loadSets()]);
    all = cards.cards;
  } catch (e) {
    A.$("#grid").innerHTML = "";
    A.$("#count").textContent = "Bibliothek nicht verfügbar. Läuft der Watcher (Server)?";
    return;
  }
  // [grpId, name, set, nr, rarity, colors, types, artId, cmc, owned, cost, isToken, isRebalanced, isPrimary, frameFlags, power, toughness, text, typeLine]
  const base = all.filter((c) => !c[11] && c[13]);
  const sets = [...new Set(base.map((c) => c[2]))].sort();
  const RAR = { 1: "Standardland", 2: "Common", 3: "Uncommon", 4: "Rare", 5: "Mythic", 0: "Token" };

  // Nutzung aus den lokalen Daten (über alle Drucke, nach Kartennamen): Siege, gespielte Matches, Decks
  const use = new Map();
  const u = (name) => { if (!use.has(name)) use.set(name, { w: 0, played: 0, casts: 0, decks: 0, m: new Set() }); return use.get(name); };
  for (const m of D.matches || []) for (const [g, n] of m.played || []) {
    const x = u(A.cardName(g));
    if (!x.m.has(m.matchId)) { x.m.add(m.matchId); x.played++; if (m.result === "Sieg") x.w++; }
    x.casts += n;
  }
  for (const d of D.decks || []) { const names = new Set(); for (const z of Object.values(d.zones || {})) for (const [g] of z) names.add(A.cardName(g)); for (const n of names) u(n).decks++; }
  const useOf = (c) => use.get(c[1]) || { w: 0, played: 0, casts: 0, decks: 0 };

  // Filter: Suche, Set, Seltenheit, Typ, Farben, Besitz, Sortierung
  const params = new URLSearchParams(location.search);
  const rerender = () => render();
  const fQ = A.searchBox(A.$("#f-q"), { placeholder: "Name suchen", value: params.get("q") || "", onInput: A.debounce(rerender, 160) });
  const fSet = A.dropdown(A.$("#f-set"), { icon: FI.set, title: "Set", searchable: true, onChange: rerender, items: [{ v: "", label: "Alle Sets", short: "Set", icon: FI.set }, ...sets.map((s) => ({ v: s, label: `${A.setName(s)}${A.setName(s) !== s ? " · " + s : ""}`, short: s, icon: FI.set }))] });
  const gem = (c) => FI.gem(c);
  const fRar = A.dropdown(A.$("#f-rar"), { title: "Seltenheit", onChange: rerender, items: [
    { v: "", label: "Alle Seltenheiten", short: "Seltenheit", icon: gem("#8d95a8") }, { v: "2", label: "Common", icon: gem("#1f242e") }, { v: "3", label: "Uncommon", icon: gem("#b9c4cc") },
    { v: "4", label: "Rare", icon: gem("#e0b654") }, { v: "5", label: "Mythic", icon: gem("#e8632a") }, { v: "1", label: "Standardland", icon: gem("#6e5a3c") }] });
  const fType = A.dropdown(A.$("#f-type"), { title: "Kartentyp", onChange: rerender, items: [
    { v: "", label: "Alle Typen", short: "Typ", icon: FI.all }, { v: "2", label: "Kreatur", icon: FI.creature }, { v: "4", label: "Spontanzauber", icon: FI.instant }, { v: "10", label: "Hexerei", icon: FI.sorcery },
    { v: "3", label: "Verzauberung", icon: FI.enchantment }, { v: "1", label: "Artefakt", icon: FI.artifact }, { v: "8", label: "Planeswalker", icon: FI.planeswalker }, { v: "5", label: "Land", icon: FI.land }, { v: "14", label: "Schlacht", icon: FI.battle }] });
  const fOwn = A.dropdown(A.$("#f-own"), { title: "Besitz", value: params.get("own") || "1", defaultValue: "1", onChange: rerender, items: [
    { v: "1", label: "Im Besitz", icon: FI.check }, { v: "", label: "Alle Karten", short: "Alle", icon: FI.all }, { v: "0", label: "Fehlende", icon: FI.x }] });
  const fSort = A.dropdown(A.$("#f-sort"), { title: "Sortierung", value: params.get("sort") || "name", onChange: rerender, items: [
    { v: "name", label: "Name A–Z", short: "Name", icon: FI.az }, { v: "wins", label: "Meiste Siege", short: "Siege", icon: FI.trophy }, { v: "played", label: "Meist gespielt", short: "Gespielt", icon: FI.play },
    { v: "decks", label: "Meist in Decks", short: "Decks", icon: FI.deck }, { v: "owned", label: "Meiste Exemplare", short: "Exemplare", icon: FI.copies }, { v: "cmc", label: "Manawert", short: "Mana", icon: FI.mana },
    { v: "rarity", label: "Seltenheit", icon: gem("#e0b654") }, { v: "set", label: "Set und Nummer", short: "Set", icon: FI.set }] });
  let colors = new Set(), page = 0;
  const PAGE = 120;
  A.$$("#f-colors button").forEach((b) => b.addEventListener("click", () => { const v = b.dataset.v; if (colors.has(v)) colors.delete(v); else colors.add(v); b.classList.toggle("on", colors.has(v)); render(); }));

  // Kartendaten für Kacheln in das globale Wörterbuch einspeisen
  const dict = {};
  for (const c of all) dict[c[0]] = [c[1], c[2], c[3], RAR[c[4]] || "", c[11], c[7], c[5], c[6], c[14] || "", c[15] || "", c[16] || "", c[17] || "", c[18] || "", c[10] || ""];

  function filtered() {
    const q = fQ.value.trim().toLowerCase(), own = fOwn.value, s = fSort.value;
    let list = base.filter((c) => {
      if (q && !c[1].toLowerCase().includes(q)) return false;
      if (fSet.value && c[2] !== fSet.value) return false;
      if (fRar.value && String(c[4]) !== fRar.value) return false;
      if (fType.value && !String(c[6]).split(",").includes(fType.value)) return false;
      if (colors.size) {
        const cc = String(c[5]).split(",").filter(Boolean);
        if (colors.has("0") && cc.length) return false;
        if ([...colors].some((v) => v !== "0" && !cc.includes(v))) return false;
      }
      if (own === "1" && !c[9]) return false;
      if (own === "0" && c[9]) return false;
      return true;
    });
    const byName = (a, b) => a[1].localeCompare(b[1], "en");
    // Bei Nutzungs-Sortierung nur ein Druck je Kartenname (der mit den meisten Exemplaren)
    if (s === "wins" || s === "played" || s === "decks") {
      const best = new Map();
      for (const c of list) { const p = best.get(c[1]); if (!p || c[9] > p[9]) best.set(c[1], c); }
      list = [...best.values()];
    }
    list.sort((a, b) => {
      if (s === "wins") { const x = useOf(a), y = useOf(b); return (y.w - x.w) || (y.played - x.played) || byName(a, b); }
      if (s === "played") { const x = useOf(a), y = useOf(b); return (y.played - x.played) || (y.casts - x.casts) || byName(a, b); }
      if (s === "decks") { const x = useOf(a), y = useOf(b); return (y.decks - x.decks) || (y.played - x.played) || byName(a, b); }
      if (s === "set") return a[2].localeCompare(b[2]) || String(a[3]).localeCompare(String(b[3]), undefined, { numeric: true });
      if (s === "cmc") return (a[8] - b[8]) || byName(a, b);
      if (s === "rarity") return (b[4] - a[4]) || byName(a, b);
      if (s === "owned") return (b[9] - a[9]) || byName(a, b);
      return byName(a, b);
    });
    return list;
  }
  let current = [];
  function render() {
    current = filtered(); page = 0;
    const owned = current.filter((c) => c[9]).length, copies = current.reduce((s, c) => s + c[9], 0);
    A.$("#count").textContent = `${current.length} Karten · ${owned} im Besitz (${copies} Exemplare) · ${sets.length} Sets`;
    A.$("#grid").innerHTML = "";
    const p = new URLSearchParams();
    if (fQ.value) p.set("q", fQ.value); if (fOwn.value !== "1") p.set("own", fOwn.value); if (fSort.value !== "name") p.set("sort", fSort.value);
    history.replaceState(null, "", location.pathname + (p.toString() ? "?" + p : ""));
    more();
  }
  function more() {
    const slice = current.slice(page * PAGE, (page + 1) * PAGE);
    page++;
    const s = fSort.value;
    const sx = (c) => { const x = useOf(c); if (s === "wins") return x.played ? `<span class="sx" title="${x.w} Siege in ${x.played} Matches">${FI.trophy}${x.w}</span>` : ""; if (s === "played") return x.played ? `<span class="sx" title="${x.played} Matches, ${x.casts}× gewirkt">${FI.play}${x.played}</span>` : ""; if (s === "decks") return x.decks ? `<span class="sx" title="in ${x.decks} Decks">${FI.deck}${x.decks}</span>` : ""; return ""; };
    A.$("#grid").insertAdjacentHTML("beforeend", slice.map((c) => A.cardTile(c[0], { dict, qty: 0, extra: `<span class="own ${c[9] ? "has" : ""}">${c[9] ? c[9] + "×" : "–"}</span><span class="cost">${A.esc(c[10])}</span>${sx(c)}`, cls: c[9] ? "" : "missing" })).join(""));
    A.Art.bind(A.$("#grid"));
    A.hoverPreview(A.$("#grid"), dict);
    A.cardLinks(A.$("#grid"), dict);
    A.$("#more").innerHTML = page * PAGE < current.length ? `<button id="b-more">Weitere ${Math.min(PAGE, current.length - page * PAGE)} Karten laden (${current.length - page * PAGE} übrig)</button>` : (current.length ? "" : "Keine Karten gefunden");
    const b = A.$("#b-more"); if (b) b.addEventListener("click", more);
  }
  // automatisch nachladen beim Scrollen
  const io = new IntersectionObserver((es) => { if (es.some((e) => e.isIntersecting) && page * PAGE < current.length) more(); });
  io.observe(A.$("#more"));
  render();
});
</script>
</body>
</html>
