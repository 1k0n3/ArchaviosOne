<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTGA Stats · Einstellungen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#100d0b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="assistant.js" data-asst="1"></script>
</head>
<body>
<script>
App.load().then(async (D) => {
  const A = App, T = A.t, FI = A.FI, $ = A.$, esc = A.esc;

  A.shell("settings.html", `
    <div class="topbar"><div><h1>${T("Einstellungen")}</h1><div class="sub">${T("Assistent, Anzeige und Begleitprogramm")}</div></div></div>
    <div class="set-tabs" id="set-tabs">
      <button type="button" class="set-tab" data-tab="ki">${T("KI-Assistent")}</button>
      <button type="button" class="set-tab" data-tab="anzeige">${T("Anzeige")}</button>
      <button type="button" class="set-tab" data-tab="konto">${T("Konto")}</button>
      <button type="button" class="set-tab" data-tab="companion">${T("Begleitprogramm")}</button>
      <button type="button" class="set-tab" data-tab="info">${T("Info")}</button>
    </div>
    <div class="settings">
      <section class="panel set-block" data-pane="ki">
        <h3>${T("KI-Assistent")}</h3>
        <p class="muted small set-intro">${T("Modell verknüpfen: Anbieter wählen, verbinden, Modell auswählen. Der Zugangsschlüssel bleibt auf diesem Rechner.")}</p>
        <div class="asst-set open" id="asst-set"></div>
      </section>
      <section class="panel set-block" data-pane="anzeige">
        <h3>${T("Anzeige")}</h3>
        <div class="set-row"><div><div class="lbl">${T("Sprache")}</div><div class="hint">${T("Gilt für das ganze Dashboard.")}</div></div>
          <select id="set-lang">${window.I18N ? Object.entries(I18N.LANGS).map(([k, v]) => `<option value="${k}" ${k === I18N.lang ? "selected" : ""}>${esc(v)}</option>`).join("") : ""}</select></div>
        <div class="set-row"><div><div class="lbl">${T("Gespeicherte Ansichten zurücksetzen")}</div><div class="hint">${T("Kachelgröße, Listen- oder Rasteransicht, eingeklappte Bereiche und ausgeblendete Hinweise.")}</div></div>
          <button type="button" class="ghost small" id="set-reset-view">${T("Zurücksetzen")}</button></div>
      </section>
      <section class="panel set-block" data-pane="konto" id="sync-block">
        <h3>${T("Konto")}</h3>
        <p class="muted small set-intro">${T("Verbinde dieses Gerät mit deinem Konto auf der Website. Danach landen Decks, Matches, Sammlung und der Zugang des Assistenten dort und du kannst deine Daten überall öffnen.")}</p>
        <div id="sync-body"><div class="muted small">${T("Wird geladen …")}</div></div>
      </section>
      <div class="set-cols" id="watch-block" data-pane="companion">
        <p class="muted small set-intro" id="watch-note">${T("Wird geladen …")}</p>
        <section class="panel set-block" id="prog-block">
          <h3>${T("Programm")}</h3>
          <div id="prog-body"><div class="muted small">${T("Wird geladen …")}</div></div>
        </section>
        <div id="watch-fields"></div>
      </div>
      <section class="panel set-block" data-pane="info">
        <h3>${T("Info")}</h3>
        <div id="set-info" class="set-info"></div>
      </section>
    </div>`);

  // ---- Reiter: gemeinsamer Baustein, gleiche Logik wie auf der Website ------------------------
  const tabs = A.settingsTabs();
  const showTab = tabs.show;

  // ---- Assistent: dieselbe Oberfläche wie im Assistenten-Fenster, nur hier eingebettet ----------
  if (window.Assistant) window.Assistant.settingsInto($("#asst-set"));
  else $("#asst-set").innerHTML = `<div class="muted small">${T("Der Assistent braucht den lokalen Server.")}</div>`;

  // ---- Anzeige ---------------------------------------------------------------------------------
  $("#set-lang") && $("#set-lang").addEventListener("change", (ev) => window.I18N && I18N.set(ev.target.value));
  A.enhanceSelects(document.querySelector(".settings"));
  $("#set-reset-view").addEventListener("click", () => {
    if (!confirm(T("Alle gespeicherten Ansichtseinstellungen zurücksetzen?"))) return;
    try { for (const k of Object.keys(localStorage)) if (/^mtga-(view|tile|deck-tile|fold|builder-hint|builder-tile)/.test(k)) localStorage.removeItem(k); } catch (e) { /* ohne Speicher */ }
    location.reload();
  });

  // ---- Website: verbinden, trennen, abgleichen – ohne Umweg über das Tray-Menü -----------------
  async function renderSync() {
    const box = $("#sync-body");
    if (!box) return;
    let st = null;
    try { st = await A.getJson("api/sync/state", 15000); } catch (e) { $("#sync-block").remove(); for (const b of A.$$(".set-tab")) if (b.dataset.tab === "konto") b.remove(); return; }
    const when = st.lastFlushAt ? A.fmtDate(st.lastFlushAt) + " " + A.fmtTime(st.lastFlushAt) : "–";
    box.innerHTML = st.connected
      ? `<div class="set-row"><div><div class="lbl">${T("Verbunden als {n}", { n: A.esc((st.user && (st.user.displayName || st.user.handle)) || "?") })}</div>
           <div class="hint">${A.esc(st.url)} · ${T("zuletzt abgeglichen: {t}", { t: when })} · ${T("{n} in der Warteschlange", { n: st.queued })}${st.lastError ? " · " + A.esc(st.lastError) : ""}</div>
           ${st.restore ? `<div class="hint">${T("Daten vom Konto zuletzt geholt: {t}", { t: A.fmtDate(st.restore.at) + " " + A.fmtTime(st.restore.at) })}${st.restore.left ? " · " + T("{n} Matches folgen", { n: st.restore.left }) : ""}${st.restore.error && st.restore.error !== "nicht verbunden" ? " · " + A.esc(st.restore.error) : ""}</div>` : `<div class="hint">${T("Deine Daten vom Konto werden geholt …")}</div>`}</div>
           <div class="sync-btns"><button type="button" class="ghost small" id="sync-now">${T("Jetzt abgleichen")}</button><button type="button" class="ghost small danger" id="sync-off">${T("Trennen")}</button></div></div>`
      : `<div class="set-row"><div><div class="lbl">${T("Nicht verbunden")}</div>
           <div class="hint">${T("Melde dich mit deinem Konto an. Es öffnet sich die Website, dort bestätigst du dieses Gerät.")}</div></div>
           <button type="button" class="primary small" id="sync-login">${T("Mit Konto anmelden")}</button></div>
         <div class="set-row"><div style="flex:1"><label class="asst-lbl">${T("Oder Verbindungscode eintragen")}</label>
           <input type="text" id="sync-code" maxlength="12" spellcheck="false" autocomplete="off" placeholder="ABCD1234" style="max-width:220px"></div>
           <button type="button" class="ghost small" id="sync-on">${T("Verbinden")}</button></div>`;
    const msg = (t, bad) => { const el = document.createElement("div"); el.className = "hint" + (bad ? " bad" : ""); el.textContent = t; box.appendChild(el); };
    const on2 = null;
    const on = $("#sync-on"), off = $("#sync-off"), now = $("#sync-now"), login = $("#sync-login");
    if (login) login.addEventListener("click", async () => {
      try {
        const j = await A.getJson("api/sync/login", 15000);
        if (j.error) throw new Error(j.error);
        const w = window.open(j.url, "mtga-login", "width=520,height=760");
        const done = (e) => { if (e.data !== "mtga-sync-connected") return; window.removeEventListener("message", done); renderSync(); };
        window.addEventListener("message", done);
        const poll = setInterval(async () => { if (w && w.closed) { clearInterval(poll); await renderSync(); } }, 900);
      } catch (e) { msg(String(e.message || e), true); }
    });
    if (on) on.addEventListener("click", async () => {
      on.disabled = true;
      try {
        const r = await fetch("api/sync/connect", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: $("#sync-code").value }) });
        const j = await r.json();
        if (j.error) throw new Error(j.error);
        await renderSync();
      } catch (e) { on.disabled = false; msg(String(e.message || e), true); }
    });
    if (off) off.addEventListener("click", async () => {
      if (!confirm(T("Verbindung zur Website wirklich trennen?"))) return;
      await fetch("api/sync/disconnect", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      await renderSync();
    });
    if (now) now.addEventListener("click", async () => {
      now.disabled = true; now.textContent = T("Wird abgeglichen …");
      let g = null;
      try { const r = await fetch("api/sync/now", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); g = (await r.json()).geholt; } catch (e) { /* Meldung steht im Stand */ }
      await renderSync();
      if (g && g.changed) msg(T("Vom Konto geholt: {m} Matches{s}", { m: g.matches, s: (g.collection ? ", " + T("Sammlung") : "") + (g.account ? ", " + T("Kontostand") : "") }));
    });
  }
  renderSync();

  // ---- Begleitprogramm: watch-config.json über den lokalen Server ------------------------------
  const GROUPS = { dashboard: T("Dashboard und Server"), scan: T("Sammlung erfassen"), export: T("Export"), sync: T("Website-Sync"), update: T("Updates") };
  const row = (f, v) => `<div class="set-row" data-key="${f.key}">
      <div><div class="lbl">${esc(T(f.label))}</div>${f.hint ? `<div class="hint">${esc(T(f.hint))}</div>` : ""}</div>
      ${f.type === "bool"
        ? `<label class="switch"><input type="checkbox" ${v ? "checked" : ""}><span></span></label>`
        : `<input type="number" class="num" value="${esc(String(v))}" min="${f.min}" max="${f.max}" step="1">`}
    </div>`;
  let info = null;
  try {
    info = await A.getJson("api/settings", 15000);
  } catch (e) {
    $("#watch-note").textContent = T("Nicht erreichbar – diese Einstellungen gibt es nur im lokalen Dashboard.");
    $("#watch-block").classList.add("off");
    const inf = $("#set-info"); if (inf) inf.closest(".set-block").remove();
    for (const b of A.$$(".set-tab")) if (b.dataset.tab === "info" || b.dataset.tab === "companion") b.remove();
    showTab(location.hash.slice(1) || "ki");
  }
  /**
   * Programm: aktualisieren und deinstallieren – passend zur Installationsart. Windows (ZIP),
   * Linux/Steam Deck und macOS (install.sh) machen alles selbst; Flatpak und Homebrew bekommen den
   * passenden Befehl; im Entwicklungsordner (Git) bleibt beides gesperrt.
   */
  async function programm(info) {
    const pb = $("#prog-body");
    if (!pb) return;
    pb.innerHTML = `
      <div class="set-row" id="up-row"><div><div class="lbl">${T("Version")} <span class="muted" id="up-ver"></span></div><div class="hint" id="up-text">${T("Wird geladen …")}</div></div>
        <div class="sync-btns"><button type="button" class="primary small" id="up-now">${T("Aktualisieren")}</button></div></div>
      <div class="set-row" id="up-auto-row"><div><div class="lbl">${T("Automatisch aktualisieren")}</div><div class="hint">${T("Neue Versionen werden geladen und eingespielt, sobald Arena nicht läuft. Einstellungen und Daten bleiben.")}</div></div>
        <label class="switch"><input type="checkbox" id="up-auto" ${info.config.autoUpdate !== false ? "checked" : ""}><span></span></label></div>
      <div class="set-row" id="un-row"><div><div class="lbl">${T("Deinstallieren")}</div><div class="hint" id="un-text">${T("Wird geladen …")}</div></div>
        <div class="sync-btns"><button type="button" class="ghost small danger" id="un-open">${T("Deinstallieren …")}</button></div></div>
      <div class="un-box" id="un-box" hidden></div>`;
    const devNote = (u) => {
      if (!u || u.kind !== "dev" || $("#prog-dev")) return;
      pb.insertAdjacentHTML("afterbegin", `<div class="prog-note" id="prog-dev"><b>${T("Entwicklungsordner")}</b> ${T("Dieser PC startet MTGA Stats direkt aus deinem Git-Ordner. Aktualisiert wird hier über Git, und „Deinstallieren“ würde deinen Quellcode löschen – deshalb sind beide Knöpfe hier gesperrt. Auf installierten Geräten (Windows-ZIP, Linux und Steam Deck, Mac) funktionieren sie.")}</div>`);
    };

    // ---- Aktualisieren ----
    const kurz = (x) => (x ? x.slice(0, 7) : "?");
    const btn = $("#up-now");
    const zeige = (u) => {
      if (!u) return;
      $("#up-ver").textContent = [u.version, u.current ? kurz(u.current) : ""].filter(Boolean).join(" · ");
      const t = [];
      if (u.kind === "dev") t.push(T("Gesperrt – siehe Hinweis oben."));
      else if (u.blocked) t.push(T(u.blocked));
      else if (u.error) t.push(T("Prüfung fehlgeschlagen: {e}", { e: u.error }));
      else if (u.latest && u.available) t.push(T("Neue Version verfügbar ({a} → {b})", { a: u.current ? kurz(u.current) : T("unbekannt"), b: kurz(u.latest) }));
      else if (u.latest) t.push(T("Aktuell ({a})", { a: kurz(u.latest) }));
      if (u.checkedAt && !u.blocked) t.push(T("geprüft {t}", { t: A.fmtDate(u.checkedAt) + " " + A.fmtTime(u.checkedAt) }));
      if (u.waiting) t.push(T(u.waiting));
      $("#up-text").textContent = t.join(" · ") || T("Noch nicht geprüft.");
      btn.disabled = !!u.blocked;
      btn.title = u.blocked ? T(u.blocked) : "";
      btn.textContent = u.available && !u.blocked ? T("Jetzt aktualisieren") : T("Aktualisieren");
      devNote(u);
    };
    const hol = async (method, pfad) => {
      try { const r = await fetch(pfad, { method, headers: { "Content-Type": "application/json" }, body: method === "POST" ? "{}" : undefined }); const u = await r.json(); zeige(u); return u; }
      catch (e) { $("#up-text").textContent = String(e.message || e); return null; }
    };
    hol("GET", "api/update/state");
    btn.addEventListener("click", async () => {
      btn.disabled = true; $("#up-text").textContent = T("Suche …");
      let u = await hol("POST", "api/update/check");
      if (!u || u.error || u.blocked) { btn.disabled = !!(u && u.blocked); return; }
      if (!u.available) { $("#up-text").textContent = T("Du hast bereits die neueste Version ({a}).", { a: kurz(u.latest) }); btn.disabled = false; return; }
      if (!confirm(T("Jetzt aktualisieren? Das Dashboard ist danach kurz nicht erreichbar; Einstellungen und Daten bleiben."))) { btn.disabled = false; return; }
      $("#up-text").textContent = T("Update läuft …");
      u = await hol("POST", "api/update/now");
      // Der Watcher startet mit dem neuen Stand neu: warten, bis das Dashboard wieder antwortet, dann neu laden
      if (!u || u.error || u.waiting || u.blocked || !u.appliedAt || Date.now() - Date.parse(u.appliedAt) > 60000) { btn.disabled = false; return; }
      btn.disabled = true;
      $("#up-text").textContent = T("Update läuft – die Seite lädt gleich neu.");
      const start = Date.now();
      // Unter Windows startet der Watcher beim nächsten Rundgang neu (bis zu 30 s), sonst sofort
      await new Promise((ok) => setTimeout(ok, info.platform === "win32" ? 35000 : 8000));
      while (Date.now() - start < 120000) {
        try { const r = await fetch("api/update/state", { cache: "no-store" }); if (r.ok && !(await r.json()).available) break; } catch (e) { /* noch nicht wieder da */ }
        await new Promise((ok) => setTimeout(ok, 3000));
      }
      location.reload();
    });
    $("#up-auto").addEventListener("change", async (ev) => {
      const r = $("#up-auto-row");
      try {
        const j = await (await fetch("api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ autoUpdate: ev.target.checked }) })).json();
        if (j.error) throw new Error(j.error);
        r.classList.add("saved"); setTimeout(() => r.classList.remove("saved"), 1200);
      } catch (e) { r.classList.add("bad"); setTimeout(() => r.classList.remove("bad"), 2000); }
    });

    // ---- Deinstallieren ----
    let un = null;
    try { un = await A.getJson("api/uninstall/info", 15000); } catch (e) { un = null; }
    const box = $("#un-box"), open = $("#un-open");
    const WAS = {
      windows: T("Beendet Tray und Companion und entfernt Autostart, die Verknüpfungen im Startmenü und auf dem Desktop, das Profil des App-Fensters und die Programmdateien."),
      linux: T("Beendet den Companion und entfernt den Hintergrunddienst, die Einträge im Anwendungsmenü und auf dem Desktop, die Profile des App-Fensters und die Programmdateien."),
      mac: T("Beendet den Companion und entfernt den Launch-Agent, „MTGA Stats.app“ und die Programmdateien.")
    };
    if (!un) { $("#un-text").textContent = T("Nicht verfügbar."); open.disabled = true; return; }
    if (!un.can) {
      $("#un-text").textContent = un.kind === "dev" ? T("Gesperrt – siehe Hinweis oben.") : T(un.hint);
      open.title = T(un.hint);
      devNote(un);
      if (un.command) {
        open.hidden = true; box.hidden = false;
        box.innerHTML = `<div class="cmd-row"><code>${esc(un.command)}</code><button type="button" class="ghost small" id="un-copy">${T("Kopieren")}</button></div>`;
        $("#un-copy").addEventListener("click", async (ev) => { try { await navigator.clipboard.writeText(un.command); ev.target.textContent = T("Kopiert"); } catch (e) { /* ohne Zwischenablage */ } });
      } else open.disabled = true;
      return;
    }
    $("#un-text").textContent = WAS[un.kind] || "";
    open.addEventListener("click", () => {
      if (!box.hidden) { box.hidden = true; return; }
      box.hidden = false;
      box.innerHTML = `
        <p>${T("Was mit deinem Website-Konto verbunden ist (Matches, Decks, Sammlung), bleibt dort erhalten.")}</p>
        <label class="un-check"><input type="checkbox" id="un-data"> ${T("Auch meine Daten auf diesem Gerät löschen")}</label>
        <div class="hint">${T("Sonst bleiben Matches, Replays und Einstellungen in {d}.", { d: esc(un.dataDir) })}</div>
        <div class="sync-btns"><button type="button" class="ghost small" id="un-cancel">${T("Abbrechen")}</button><button type="button" class="small un-go" id="un-go">${T("Endgültig deinstallieren")}</button></div>`;
      $("#un-cancel").addEventListener("click", () => { box.hidden = true; });
      $("#un-go").addEventListener("click", async (ev) => {
        const mitDaten = $("#un-data").checked;
        if (!confirm(mitDaten ? T("MTGA Stats samt deinen Daten jetzt von diesem Gerät entfernen?") : T("MTGA Stats jetzt von diesem Gerät entfernen?"))) return;
        ev.target.disabled = true;
        try {
          const r = await fetch("api/uninstall/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ confirm: "entfernen", data: mitDaten }) });
          const j = await r.json();
          if (!r.ok || j.error) throw new Error(j.error || "HTTP " + r.status);
          // Gleich ist der Companion weg; die Seite sagt noch, was passiert ist
          document.querySelector(".settings").innerHTML = `<section class="panel set-block un-done"><h3>${T("MTGA Stats wird entfernt")}</h3>
            <p>${T("In wenigen Sekunden ist alles weg. Du kannst dieses Fenster jetzt schließen.")}</p>
            ${j.dataDeleted ? "" : `<p class="muted small">${T("Deine Daten liegen weiter in {d}.", { d: esc(un.dataDir) })}</p>`}
            <p class="muted small">${T("Wieder installieren: von der Website unter „Companion“.")}</p></section>`;
          for (const t of A.$$(".set-tab")) t.disabled = true;
        } catch (e) { ev.target.disabled = false; box.insertAdjacentHTML("beforeend", `<div class="hint bad">${esc(String(e.message || e))}</div>`); }
      });
    });
  }

  if (info) {
    const byGroup = {};
    for (const f of info.fields) if (f.group !== "update") (byGroup[f.group] = byGroup[f.group] || []).push(f);
    // Reihenfolge so, dass sich die Karten gut auf zwei Spalten verteilen; die lange Scan-Gruppe zuletzt
    const ORDER = ["dashboard", "sync", "export", "scan"];
    const gruppen = Object.keys(byGroup).sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99))
      .filter((g) => g !== "scan" || info.memoryScan);
    $("#watch-fields").innerHTML = gruppen.map((g) =>
      `<section class="panel set-block set-card"><h3>${esc(GROUPS[g] || g)}</h3>${byGroup[g].map((f) => row(f, info.config[f.key])).join("")}</section>`).join("");
    A.enhanceSelects($("#watch-fields"));
    programm(info);
    $("#watch-note").innerHTML = (info.platform === "win32"
      ? T("Änderungen gelten, sobald der Watcher neu startet (Tray-Menü: stoppen, dann starten).")
      : T("Änderungen gelten, sobald der Companion neu startet (Konsole: mtga-stats restart).")) + ` <span class="muted">${esc(info.file)}</span>`;

    const save = A.debounce(async (key, value, el) => {
      try {
        const r = await fetch("api/settings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ [key]: value }) });
        const j = await r.json();
        if (j.error) throw new Error(j.error);
        el.classList.add("saved");
        setTimeout(() => el.classList.remove("saved"), 1200);
      } catch (e) {
        el.classList.add("bad");
        $("#watch-note").textContent = String(e.message || e);
        setTimeout(() => el.classList.remove("bad"), 2000);
      }
    }, 400);
    $("#watch-fields").addEventListener("change", (ev) => {
      const r = ev.target.closest(".set-row");
      if (!r) return;
      const key = r.dataset.key;
      save(key, ev.target.type === "checkbox" ? ev.target.checked : +ev.target.value, r);
    });

    const yn = (b) => b ? T("ja") : T("nein");
    const st = A.stats(D.matches || []);
    $("#set-info").innerHTML = [
      [T("Version"), info.version], [T("Node"), info.node], [T("System"), info.platform],
      [T("Speicher-Scan möglich"), yn(info.memoryScan)],
      [T("Einstellungsdatei"), info.file], [T("Ausgabeordner"), info.outDir],
      [T("Arena-Protokoll"), info.logDir || "–"], [T("Arena-Installation"), info.installDir || "–"],
      [T("Website-Sync"), info.syncUrl || T("nicht verbunden")],
      [T("Daten"), T("{d} Decks · {m} Matches", { d: (D.decks || []).length, m: st.n })]
    ].map(([k, v]) => `<div class="set-info-row"><span>${esc(k)}</span><b>${esc(String(v))}</b></div>`).join("");
  }
});
</script>
</body>
</html>
