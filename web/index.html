<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTGA Stats · Übersicht</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0e18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</head>
<body>
<script>
App.load().then((D) => {
  const A = App, T = A.t;
  A.shell("index.html", `
    <div class="topbar"><div><h1>${T("Übersicht")}</h1><div class="sub">${T("Siege, Decks und Form auf einen Blick")}</div></div>
      <div class="right filters">
        <div id="f-range"></div>
        <div id="f-format"></div>
        <div id="f-deck"></div>
      </div></div>
    <div class="hero" id="hero"></div>
    <div class="tiles" id="tiles" style="margin-top:14px"></div>
    <div id="account"></div>
    <h2 class="fold-h2" id="h-charts">${T("Statistik")}</h2>
    <div class="grid c2" id="charts" style="margin-top:14px">
      <div class="panel"><h3>${T("Winrate-Verlauf")} <span class="muted small" style="text-transform:none;letter-spacing:0">${T("gleitend über 10 Matches")}</span></h3><div id="chart-trend"></div></div>
      <div class="panel"><h3>${T("Matches pro Tag")}</h3><div id="chart-days"></div></div>
      <div class="panel"><h3>${T("Spiellänge in Zügen")}</h3><div id="chart-turns"></div></div>
      <div class="panel"><h3>${T("Spielbeginn")}</h3><div class="stat-split" id="playdraw"></div><div id="rate-time" style="margin-top:12px"></div></div>
      <div class="panel"><h3>${T("Winrate pro Deck")}</h3><div id="rate-decks" class="rate-decks"></div></div>
      <div class="panel"><h3>${T("Winrate nach Format & Gegner-Plattform")}</h3><div id="rate-format"></div><div id="rate-platform" style="margin-top:10px"></div></div>
    </div>
    <h2 class="fold-h2" id="h-recent">${T("Letzte Matches")} <a href="matches.html">${T("alle anzeigen →")}</a></h2>
    <div class="panel" id="recent-panel" style="padding:6px 8px"><table id="recent"><thead><tr><th>${T("Wann")}</th><th>${T("Ergebnis")}</th><th>${T("Deck")}</th><th>${T("Gegner")}</th><th>${T("Event")}</th><th>${T("Züge")}</th><th>${T("Dauer")}</th><th></th></tr></thead><tbody></tbody></table></div>
  `);
  let range = 30;
  const FI = A.FI, rerender = () => render();
  A.foldable(A.$("#h-charts"), A.$("#charts"), "index-charts", !A.isMobile());
  A.foldable(A.$("#h-recent"), A.$("#recent-panel"), "index-recent", !A.isMobile());
  const fRange = A.dropdown(A.$("#f-range"), { title: T("Zeitraum"), value: "30", defaultValue: "30", onChange: (v) => { range = +v; render(); }, items: [
    { v: "7", label: T("Letzte 7 Tage"), short: T("7 Tage"), icon: FI.calendar }, { v: "30", label: T("Letzte 30 Tage"), short: T("30 Tage"), icon: FI.calendar }, { v: "90", label: T("Letzte 90 Tage"), short: T("90 Tage"), icon: FI.calendar }, { v: "0", label: T("Alle Matches"), short: T("Alle"), icon: FI.all }] });
  const fFormat = A.dropdown(A.$("#f-format"), { title: T("Format"), onChange: rerender, items: [{ v: "", label: T("Alle Formate"), short: T("Format"), icon: FI.set }, ...[...new Set(D.matches.map((m) => m.format).filter(Boolean))].sort().map((f) => ({ v: f, label: f, icon: FI.set }))] });
  const fDeck = A.dropdown(A.$("#f-deck"), { title: T("Deck"), searchable: true, onChange: rerender, items: [{ v: "", label: T("Alle Decks"), short: T("Deck"), icon: FI.deck }, ...[...new Set(D.matches.map(A.deckLabel))].sort().map((d) => ({ v: d, label: d, icon: FI.deck }))] });

  const isW = (m) => m.result === "Sieg", isL = (m) => m.result === "Niederlage";
  const matchLine = (m) => `<div class="row"><span class="${isW(m) ? "dotw" : "dotl"}"></span>${A.fmtTime(m.start)} ${A.esc(T(m.result))} vs <b>${A.esc(m.opponent)}</b> <span class="muted">(${A.esc(m.myDeck)}, ${m.turns} ${T("Züge")})</span></div>`;
  const rateOf = (map, tileFn) => [...map.entries()].map(([label, ms]) => ({ label, tile: tileFn ? tileFn(ms[0]) : undefined, w: ms.filter(isW).length, l: ms.filter(isL).length,
    tipHtml: `<b>${A.esc(label)}</b><br>${T("{w} Siege, {l} Niederlagen", { w: ms.filter(isW).length, l: ms.filter(isL).length })} · Ø ${(ms.reduce((s, m) => s + m.turns, 0) / ms.length).toFixed(1)} ${T("Züge")}<br><span class="muted">${T("zuletzt {d}", { d: A.relDate(Math.max(...ms.map((m) => m.start))) })}</span>` }))
    .sort((a, b) => (b.w + b.l) - (a.w + a.l));

  function filtered() {
    const since = range ? Date.now() - range * 86400000 : 0;
    return D.matches.filter((m) => m.start >= since && (!fFormat.value || m.format === fFormat.value) && (!fDeck.value || A.deckLabel(m) === fDeck.value));
  }
  // Konto: Gold, Edelsteine, Wildcards, Tresor, Rang, Mastery, Tagesquests (aus der Player.log)
  function renderAccount() {
    const a = D.account, el = A.$("#account");
    if (!a) { el.innerHTML = ""; return; }
    const wc = a.wildcards || {};
    // Rang-Kachel mit Emblem aus den Spieldaten (lokal über den Dashboard-Server, auf der Website als mitgesendetes Bild)
    const rank = (r, label, fmt) => {
      if (!r) return "";
      const icon = a.rankIcons && a.rankIcons[fmt];
      return `<div class="tile rank ${icon ? "has-icon" : ""}"><div class="label">${FI.trophy}${label}</div>${icon ? `<img class="emblem" src="${A.esc(icon)}" alt="" loading="lazy" onerror="this.remove()">` : ""}<div class="value">${A.esc(T(r.tier || "Ohne Rang"))}${r.key && r.key !== "unranked" && r.key !== "mythic" && r.level ? " " + r.level : ""}</div><div class="sub">${r.won || r.lost ? T("{w} S · {l} N", { w: r.won, l: r.lost }) : ""}${fmt === "constructed" && a.season && a.season.end ? (r.won || r.lost ? " · " : "") + T("Saison endet {d}", { d: A.fmtDate(a.season.end) }) : ""}</div></div>`;
    };
    // Erfolge: Kachel mit Zähler und darunter die offenen (abholbar, in Arbeit, fast fertig); Ids aus dem Spiel lesbar gemacht
    const ach = a.achievements || null;
    const achList = ach ? Object.entries(ach.groups || {}).flatMap(([g, v]) => v.list.map((x) => Object.assign({ group: g }, x))) : [];
    const achDone = achList.filter((x) => x.status === "Completed").length, achTotal = achList.length;
    const claimable = new Set(ach && ach.claimable || []), close = new Set(ach && ach.closeToComplete || []);
    const nice = (id) => id.replace(/Tier(\d)$/, " $1").replace(/(Cumulative|Oneshot)$/, "").replace(/([a-z0-9])([A-Z])/g, "$1 $2").trim();
    const open = achList.filter((x) => x.status !== "Completed" && (claimable.has(x.id) || close.has(x.id) || x.progress != null))
      .sort((x, y) => (claimable.has(y.id) - claimable.has(x.id)) || (close.has(y.id) - close.has(x.id)) || ((y.progress || 0) - (x.progress || 0)));
    const inProgress = achList.filter((x) => x.status !== "Completed" && x.progress != null).length;
    const achHtml = open.map((x) => `<div class="ach ${claimable.has(x.id) ? "claim" : ""}"><b>${A.esc(nice(x.id))}</b><span class="muted small">${T(x.group === "Colors" ? "Farben" : "Kern")}${claimable.has(x.id) ? ` · <em>${T("abholbar")}</em>` : close.has(x.id) ? " · " + T("fast fertig") : ""}${x.progress != null ? " · " + T("Fortschritt {n}", { n: x.progress }) : ""}</span></div>`).join("");
    const achTile = ach ? `<div class="tile"><div class="label">${FI.trophy}${T("Erfolge")}</div><div class="value">${achDone}<span class="muted small"> / ${achTotal}</span></div><div class="sub">${[claimable.size ? T("{n} abholbar", { n: claimable.size }) : "", inProgress ? T("{n} in Arbeit", { n: inProgress }) : ""].filter(Boolean).join(" · ")}</div></div>` : "";
    const quests = (a.quests || []).map((q) => `<div class="quest"><b>${A.esc(q.name)}</b><span class="muted small">${T("Ziel")} ${q.goal}${q.reward && q.reward.gold ? " · " + q.reward.gold + " " + T("Gold") : ""}</span></div>`).join("");
    el.innerHTML = `<h2 class="fold-h2" id="h-account">${T("Konto")} <span class="muted small" style="text-transform:none;letter-spacing:0">${T("Stand")} ${A.fmtDate(a.takenAt)} ${A.fmtTime(a.takenAt)}</span></h2>
      <div id="account-body"><div class="tiles account">
        <div class="tile"><div class="label">${FI.gem("#f2b134")}${T("Gold")}</div><div class="value gold" ${a.gold == null ? `title="${T("nicht im Protokoll")}"` : ""}>${a.gold == null ? "?" : a.gold.toLocaleString()}</div></div>
        <div class="tile"><div class="label">${FI.gem("#8fb8ff")}${T("Edelsteine")}</div><div class="value gems">${(a.gems || 0).toLocaleString()}</div></div>
        <div class="tile"><div class="label">${FI.copies}${T("Wildcards")}</div><div class="value wcs"><span class="wc wc-c" title="Common">${wc.c || 0}</span><span class="wc wc-u" title="Uncommon">${wc.u || 0}</span><span class="wc wc-r" title="Rare">${wc.r || 0}</span><span class="wc wc-m" title="Mythic">${wc.m || 0}</span></div></div>
        <div class="tile"><div class="label">${FI.all}${T("Tresor")}</div><div class="value">${(a.vault || 0).toFixed(1)} %</div><div class="sub">${a.orbs ? T("{n} Orbs", { n: a.orbs }) : ""}</div></div>
        ${rank(a.rank && a.rank.constructed, T("Constructed"), "constructed")}${rank(a.rank && a.rank.limited, T("Limited"), "limited")}
        ${a.mastery ? `<div class="tile mastery"><div class="label">${FI.play}${T("Mastery")} ${A.esc(a.mastery.pass)}</div><span class="emblem set">${A.setIcon(a.mastery.pass)}</span><div class="value">${T("Level")} ${a.mastery.level}</div><div class="sub">${a.mastery.xp != null ? a.mastery.xp + " XP" : ""}${a.mastery.premium ? " · Premium" : ""}</div></div>` : ""}
        ${achTile}
        ${a.boosters && a.boosters.length ? `<div class="tile"><div class="label">${FI.set}${T("Booster")}</div><div class="value">${a.boosters.reduce((s, b) => s + b.count, 0)}</div><div class="sub">${a.boosters.slice(0, 4).map((b) => A.esc(b.set) + " ×" + b.count).join(", ")}</div></div>` : ""}
      </div>${quests ? `<div class="quests"><div class="ds-t">${T("Tagesquests")}</div>${quests}</div>` : ""}${ach ? `<div class="achs"><div class="ds-t">${T("Erfolge")} <span class="muted small" style="text-transform:none;letter-spacing:0">${achDone} / ${achTotal}</span></div>${achHtml || `<div class="muted small">${T("Alle erledigt")}</div>`}</div>` : ""}</div>`;
    A.foldable(A.$("#h-account"), A.$("#account-body"), "index-account", true);
  }
  function render() {
    const list = filtered().sort((a, b) => b.start - a.start);
    const chrono = [...list].reverse();
    const s = A.stats(list);
    const streak = (() => { let n = 0, t = list[0] && list[0].result; for (const m of list) { if (m.result === t) n++; else break; } return t ? T("{n}× {r} in Folge", { n, r: T(t) }) : ""; })();
    A.$("#hero").innerHTML = `${A.ring(s.rate)}<div><div class="title">${T("{w} Siege · {l} Niederlagen", { w: s.w, l: s.l })}</div><div class="desc">${T("{n} Matches", { n: s.n })} ${range ? T("in den letzten {n} Tagen", { n: range }) : T("insgesamt")}${streak ? " · " + streak : ""}</div>
      <div class="form">${list.slice(0, 15).reverse().map((m) => `<div class="d ${isW(m) ? "w" : isL(m) ? "l" : ""}" data-tip="${A.esc(`${A.fmtDate(m.start)} ${A.esc(T(m.result))} vs ${m.opponent} (${m.myDeck}, ${m.turns} ${T("Züge")})`)}"></div>`).join("")}<span class="lbl">${T("letzte {n} Matches", { n: Math.min(15, list.length) })}</span></div></div>`;
    A.$$("#hero .form .d").forEach((d) => { d.addEventListener("mousemove", (ev) => A.tooltip(true, d.dataset.tip, ev)); d.addEventListener("mouseleave", () => A.tooltip(false)); });

    const onPlay = list.filter((m) => m.onPlay === true), onDraw = list.filter((m) => m.onPlay === false);
    const sp = A.stats(onPlay), sd = A.stats(onDraw);
    A.$("#tiles").innerHTML = [
      [T("Matches"), s.n, "", ""], [T("Siege"), s.w, "", "win"], [T("Niederlagen"), s.l, "", "loss"],
      [T("Winrate"), Math.round(s.rate * 100) + " %", s.w + s.l ? T("{n} von {m}", { n: s.w, m: s.w + s.l }) : "", ""],
      [T("Ø Züge"), s.avgTurns.toFixed(1), "", ""], [T("Ø Dauer"), s.n ? A.fmtDur(s.avgDur) : "–", "", ""]
    ].map(([l, v, sub, cls]) => `<div class="tile ${cls}"><div class="label">${l}</div><div class="value">${v}</div><div class="sub">${sub}</div></div>`).join("");

    renderAccount();
    // Verlauf: gleitende Winrate über 10 Matches
    const win = 10;
    const pts = chrono.map((m, i) => {
      const slice = chrono.slice(Math.max(0, i - win + 1), i + 1);
      const w = slice.filter(isW).length, l = slice.filter(isL).length;
      return { y: w + l ? w / (w + l) : 0.5, mark: isW(m) ? "win" : isL(m) ? "loss" : "", label: A.fmtDate(m.start).slice(0, 5),
        html: `<b>${A.fmtDate(m.start)} ${A.fmtTime(m.start)}</b> · ${A.esc(T(m.result))} vs ${A.esc(m.opponent)}<br>${A.esc(A.deckLabel(m))}<br>${T("Winrate der letzten {n}", { n: slice.length })}: <b>${Math.round(100 * w / Math.max(1, w + l))} %</b> (${w}-${l})` };
    });
    A.lineChart(A.$("#chart-trend"), pts, { label: T("Winrate-Verlauf") });

    // pro Tag
    const byDay = A.groupBy(list, (m) => A.fmtDate(m.start));
    const days = [...byDay.entries()].sort((a, b) => a[1][0].start - b[1][0].start).map(([d, ms]) => ({
      label: d.slice(0, 5), title: d, w: ms.filter(isW).length, l: ms.filter(isL).length,
      html: `<b>${d}</b> · ${T("{n} Matches", { n: ms.length })}, ${ms.filter(isW).length}-${ms.filter(isL).length}<br>${[...ms].sort((a, b) => a.start - b.start).map(matchLine).join("")}`
    }));
    A.stackedBars(A.$("#chart-days"), days.slice(-31), { label: T("Matches pro Tag") });

    // Spiellänge
    const buckets = [["1–5", 1, 5], ["6–8", 6, 8], ["9–11", 9, 11], ["12–15", 12, 15], ["16+", 16, 999]];
    A.stackedBars(A.$("#chart-turns"), buckets.map(([label, lo, hi]) => { const ms = list.filter((m) => m.turns >= lo && m.turns <= hi); return {
      label, title: label + " " + T("Züge"), w: ms.filter(isW).length, l: ms.filter(isL).length,
      html: `<b>${label} ${T("Züge")}</b> · ${T("{n} Matches", { n: ms.length })}${ms.length ? `, ${T("Winrate")} ${Math.round(100 * ms.filter(isW).length / Math.max(1, ms.filter(isW).length + ms.filter(isL).length))} %` : ""}<br>${[...ms].sort((a, b) => b.start - a.start).slice(0, 6).map(matchLine).join("")}${ms.length > 6 ? `<div class="muted">+${ms.length - 6}</div>` : ""}` }; }), { label: T("Spiellänge"), height: 190 });

    // Spielbeginn
    A.$("#playdraw").innerHTML = [[T("Ich beginne"), sp], [T("Gegner beginnt"), sd]].map(([k, x]) => `<div class="box"><div class="k">${k}</div><div class="v">${x.n ? Math.round(x.rate * 100) + " %" : "–"}</div><div class="s">${T("{w} Siege · {l} Niederlagen", { w: x.w, l: x.l })}</div></div>`).join("");
    const hourOf = (m) => new Date(m.start).getHours();
    const slots = [[T("Morgen (6–12)"), 6, 12], [T("Nachmittag (12–18)"), 12, 18], [T("Abend (18–24)"), 18, 24], [T("Nacht (0–6)"), 0, 6]];
    A.rateRows(A.$("#rate-time"), slots.map(([label, lo, hi]) => { const ms = list.filter((m) => hourOf(m) >= lo && hourOf(m) < hi); return { label, w: ms.filter(isW).length, l: ms.filter(isL).length, tipHtml: `<b>${label}</b><br>${T("{n} Matches", { n: ms.length })}` }; }).filter((r) => r.w + r.l));

    A.rateRows(A.$("#rate-decks"), rateOf(A.groupBy(list, A.deckLabel), (m) => m.tile), { link: (r) => "decks.html?deck=" + encodeURIComponent(r.label), twoLine: true });
    A.rateRows(A.$("#rate-format"), rateOf(A.groupBy(list, (m) => m.format || A.eventLabel(m.eventId) || "?")));
    A.rateRows(A.$("#rate-platform"), rateOf(A.groupBy(list, (m) => m.opponentPlatform || "?")));
    A.$("#recent tbody").innerHTML = list.slice(0, 10).map((m) => `<tr class="clickable" onclick="location.href='replay.html?id=${m.matchId}'">
      <td>${A.relDate(m.start)}<div class="muted small">${A.fmtTime(m.start)}</div></td><td>${A.resultBadge(m.result)}<div class="muted small">${A.esc(m.reason)}</div></td>
      <td>${A.deckCell(m)}</td><td><b>${A.esc(m.opponent)}</b><div class="muted small">${A.esc(m.opponentPlatform)}</div></td>
      <td>${A.esc(A.eventLabel(m.eventId))}</td><td>${m.turns}</td><td>${A.fmtDur(m.durationSec)}</td><td>${A.replayLink(m.matchId)}</td></tr>`).join("") ||
      `<tr><td colspan="8" class="empty">${T("Keine Matches im Zeitraum")}</td></tr>`;
    A.Art.bind(document.body);
  }
  render();
});
</script>
</body>
</html>
