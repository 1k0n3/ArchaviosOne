<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTGA Stats · Übersicht</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0e18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="assistant.js" data-asst="1"></script>
</head>
<body>
<script>
App.load().then((D) => {
  const A = App, T = A.t;
  A.shell("index.html", `
    <div class="topbar"><div><h1>${T("Übersicht")}</h1><div class="sub">${T("Siege, Decks und Form auf einen Blick")}</div></div>
      <div class="right filters">
        <div id="f-range"></div>
        <div id="f-format"></div>
        <div id="f-deck"></div>
      </div></div>
    <section class="profile-hero v4" id="hero"></section>
    <section class="quests-band" id="quests"></section>
    <div id="account"></div>
    <h2 class="fold-h2" id="h-charts">${T("Statistik")}</h2>
    <div class="grid c2" id="charts" style="margin-top:14px">
      <div class="panel"><h3>${T("Winrate-Verlauf")} <span class="muted small" style="text-transform:none;letter-spacing:0">${T("gleitend über 10 Matches")}</span></h3><div id="chart-trend"></div></div>
      <div class="panel"><h3>${T("Matches pro Tag")}</h3><div id="chart-days"></div></div>
      <div class="panel"><h3>${T("Spiellänge in Zügen")}</h3><div id="chart-turns"></div></div>
      <div class="panel"><h3>${T("Spielbeginn")}</h3><div class="stat-split" id="playdraw"></div><div id="rate-time" style="margin-top:12px"></div></div>
      <div class="panel"><h3>${T("Winrate pro Deck")}</h3><div id="rate-decks" class="rate-decks"></div></div>
      <div class="panel"><h3>${T("Winrate nach Format")}</h3><div id="rate-format"></div><h3 class="sub-fold" id="h-platform" style="margin-top:14px">${T("Gegner-Plattform")}</h3><div id="rate-platform"></div></div>
    </div>
    <h2 class="fold-h2" id="h-recent">${T("Letzte Matches")} <a href="matches.html">${T("alle anzeigen →")}</a></h2>
    <div class="panel" id="recent-panel" style="padding:6px 8px"><table id="recent"><thead><tr><th>${T("Wann")}</th><th>${T("Ergebnis")}</th><th>${T("Deck")}</th><th>${T("Gegner")}</th><th>${T("Event")}</th><th>${T("Züge")}</th><th>${T("Dauer")}</th><th></th></tr></thead><tbody></tbody></table></div>
  `);
  let range = 30;
  const FI = A.FI, rerender = () => render();
  A.foldable(A.$("#h-charts"), A.$("#charts"), "index-charts", !A.isMobile());
  A.foldable(A.$("#h-recent"), A.$("#recent-panel"), "index-recent", !A.isMobile());
  A.foldable(A.$("#h-platform"), A.$("#rate-platform"), "index-platform", true);   // Gegner-Plattform standardmäßig offen
  const fRange = A.dropdown(A.$("#f-range"), { title: T("Zeitraum"), value: "30", defaultValue: "30", onChange: (v) => { range = +v; render(); }, items: [
    { v: "7", label: T("Letzte 7 Tage"), short: T("7 Tage"), icon: FI.calendar }, { v: "30", label: T("Letzte 30 Tage"), short: T("30 Tage"), icon: FI.calendar }, { v: "90", label: T("Letzte 90 Tage"), short: T("90 Tage"), icon: FI.calendar }, { v: "0", label: T("Alle Matches"), short: T("Alle"), icon: FI.all }] });
  const fFormat = A.dropdown(A.$("#f-format"), { title: T("Format"), onChange: rerender, items: [{ v: "", label: T("Alle Formate"), short: T("Format"), icon: FI.set }, ...[...new Set(D.matches.map((m) => m.format).filter(Boolean))].sort().map((f) => ({ v: f, label: f, icon: FI.set }))] });
  const fDeck = A.dropdown(A.$("#f-deck"), { title: T("Deck"), searchable: true, onChange: rerender, items: [{ v: "", label: T("Alle Decks"), short: T("Deck"), icon: FI.deck }, ...[...new Set(D.matches.map(A.deckLabel))].sort().map((d) => ({ v: d, label: d, icon: FI.deck }))] });

  const isW = (m) => m.result === "Sieg", isL = (m) => m.result === "Niederlage";
  const matchLine = (m) => `<div class="row"><span class="${isW(m) ? "dotw" : "dotl"}"></span><span>${A.fmtTime(m.start)} ${A.esc(T(m.result))} <span style="white-space:nowrap">vs&nbsp;<b>${A.esc(m.opponent)}</b></span> <span class="muted">(${A.esc(m.myDeck)}, ${m.turns} ${T("Züge")})</span></span></div>`;
  const rateOf = (map, tileFn) => [...map.entries()].map(([label, ms]) => ({ label, tile: tileFn ? tileFn(ms[0]) : undefined, w: ms.filter(isW).length, l: ms.filter(isL).length,
    tipHtml: `<b>${A.esc(label)}</b><br>${T("{w} Siege, {l} Niederlagen", { w: ms.filter(isW).length, l: ms.filter(isL).length })} · Ø ${A.num(ms.reduce((s, m) => s + m.turns, 0) / ms.length, 1)} ${T("Züge")}<br><span class="muted">${T("zuletzt {d}", { d: A.relDate(Math.max(...ms.map((m) => m.start))) })}</span>` }))
    .sort((a, b) => (b.w + b.l) - (a.w + a.l));

  function filtered() {
    const since = range ? Date.now() - range * 86400000 : 0;
    return D.matches.filter((m) => m.start >= since && (!fFormat.value || m.format === fFormat.value) && (!fDeck.value || A.deckLabel(m) === fDeck.value));
  }
  // Konto: Gold, Edelsteine, Wildcards, Tresor, Rang, Mastery, Tagesquests (aus der Player.log)
  // Erfolge aus den Kontodaten aufbereiten (Zähler, offene Einträge); Ids aus dem Spiel lesbar gemacht
  function achInfo(a) {
    const ach = a && a.achievements || null;
    if (!ach) return null;
    const list = Object.entries(ach.groups || {}).flatMap(([g, v]) => v.list.map((x) => Object.assign({ group: g }, x)));
    const claimable = new Set(ach.claimable || []), close = new Set(ach.closeToComplete || []);
    const nice = (id) => id.replace(/Tier(\d)$/, " $1").replace(/(Cumulative|Oneshot)$/, "").replace(/([a-z0-9])([A-Z])/g, "$1 $2").trim();
    // abholbare Erfolge sind im Spiel schon "Completed" (Belohnung noch nicht geholt) – trotzdem zeigen
    const open = list.filter((x) => claimable.has(x.id) || (x.status !== "Completed" && (close.has(x.id) || x.progress != null)))
      .sort((x, y) => (claimable.has(y.id) - claimable.has(x.id)) || (close.has(y.id) - close.has(x.id)) || ((y.progress || 0) - (x.progress || 0)));
    return { done: list.filter((x) => x.status === "Completed").length, total: list.length, claimable, close, open, nice, inProgress: list.filter((x) => x.status !== "Completed" && x.progress != null).length };
  }
  const rankText = (r) => A.esc(T(r.tier || "Ohne Rang")) + (r.key && r.key !== "unranked" && r.key !== "mythic" && r.level ? " " + r.level : "");

  // Bilder aus dem Spiel: lokal liefert sie der Dashboard-Server (ui/…), auf der Website kommen sie als Data-URL mit
  const ui = (k) => (D.account && D.account.uiIcons && D.account.uiIcons[k]) || null;
  const uiImg = (k, cls = "") => { const u = ui(k); return u ? `<img class="gi ${cls}" src="${A.esc(u)}" alt="" loading="eager" onerror="this.style.display='none'">` : ""; };
  const bar = (frac, cls = "") => `<div class="fbar ${cls}"><i style="width:${Math.round(Math.max(0, Math.min(1, frac || 0)) * 100)}%"></i></div>`;
  // Questfarbe aus dem Namen (Gilden und Einzelfarben), sonst allgemein
  const questIcon = (name) => {
    const n = String(name || "").toLowerCase();
    const guild = { azorius: "m", dimir: "m", rakdos: "m", gruul: "m", selesnya: "m", orzhov: "m", izzet: "m", golgari: "m", boros: "m", simic: "m" };
    for (const g of Object.keys(guild)) if (n.includes(g)) return "q_m";
    for (const [w, k] of [["white", "w"], ["blue", "u"], ["black", "b"], ["red", "r"], ["green", "g"]]) if (n.includes(w)) return "q_" + k;
    return "q_x";
  };
  /**
   * Belohnung eines Erfolgs: In Arena gibt Stufe I eine Kartenhülle, Stufe II ein Emote und Stufe III
   * einen Titel. Erfolge ohne Stufe bekommen kein Symbol, dort ist die Belohnung nicht abzuleiten.
   */
  const REWARDS = { 1: ["sleeve", "Kartenhülle", FI.rewSleeve], 2: ["emote", "Emote", FI.rewEmote], 3: ["title", "Titel", FI.rewTitle] };
  const rewardIcon = (x, cls = "arew") => {
    const m = /Tier(\d)$/.exec(x.id || "");
    const r = m && REWARDS[m[1]];
    if (!r) return "";
    const offen = x.reward && x.reward !== "Completed";   // Belohnung noch nicht abgeholt
    return `<span class="${cls} rew-${r[0]}${offen ? " offen" : ""}" title="${A.esc(T(r[1]))}${offen ? " · " + A.esc(T("noch abzuholen")) : ""}">${r[2]}</span>`;
  };
  const hoursUntil = (iso) => { const ms = new Date(iso) - Date.now(); if (isNaN(ms)) return null; return Math.max(0, Math.round(ms / 36e5)); };

  /** Profilkopf: oben Avatar mit Ring, Name, Wallet; Match-Zähler über die volle Breite; darunter kompakte Karten mit Emblemen */
  function renderProfile(s, list, streak) {
    const a = D.account || {};
    const player = D.player || T("Spieler");
    const ai = achInfo(a);
    const wc = a.wildcards || {};
    const C = 2 * Math.PI * 38, off = C * (1 - (s.n ? s.rate : 0));
    // Rangkarte (kompakt, waagerecht): Emblem mit Pip-Bogen links, Texte rechts
    const rankCard = (fmt, r, label) => {
      if (!r) return "";
      const ico = a.rankIcons && a.rankIcons[fmt] ? `<img class="emblem" src="${A.esc(a.rankIcons[fmt])}" alt="" loading="eager" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',innerHTML:window.App.FI.trophy}))">` : `<span class="ph">${FI.trophy}</span>`;
      const total = (a.season && a.season.steps && a.season.steps[fmt] && a.season.steps[fmt][(r.key || "") + ":" + r.level]) || 0;
      const pips = total && r.key !== "mythic" && r.key !== "unranked" ? Array.from({ length: total }, (_, i) => { const ang = -(i - (total - 1) / 2) * (96 / Math.max(1, total - 1)); const im = uiImg(i < (r.step || 0) ? "pip" : "pipSlot", "pip"); return im ? `<span class="pip-w" style="transform:rotate(${ang.toFixed(1)}deg)">${im}</span>` : ""; }).join("") : "";
      const n = (r.won || 0) + (r.lost || 0);
      return `<div class="rankcard"><div class="rc-emblem">${ico}<div class="pips">${pips}</div></div><div class="rc-text"><div class="rc-title">${A.esc(T(r.tier || "Ohne Rang"))}${r.key && r.key !== "unranked" && r.key !== "mythic" && r.level ? " " + r.level : ""}</div><div class="rc-sub">${label}${total && r.step != null ? " · " + r.step + "/" + total : ""}</div><div class="rc-line">${n ? T("{w} S · {l} N", { w: r.won, l: r.lost }) + " · " + Math.round(100 * r.won / n) + " %" : T("keine Matches")}</div></div></div>`;
    };
    const ring = (done, total) => { const c = 2 * Math.PI * 22, o = c * (1 - (total ? done / total : 0)); return `<div class="ringc"><svg viewBox="0 0 52 52"><circle class="t" cx="26" cy="26" r="22"/><circle class="p" cx="26" cy="26" r="22" style="stroke-dasharray:${c.toFixed(1)};stroke-dashoffset:${o.toFixed(1)}"/></svg><span>${done}<i>/${total}</i></span></div>`; };
    const track = (xp) => { const f = Math.max(0, Math.min(1, (xp || 0) / 1000)); return `<div class="track"><i class="fill" style="width:${(f * 100).toFixed(1)}%"></i>${Array.from({ length: 11 }, (_, i) => `<b style="left:${i * 10}%" class="${i * 100 <= (xp || 0) ? "on" : ""}"></b>`).join("")}</div>`; };
    const cards = [
      rankCard("constructed", a.rank && a.rank.constructed, T("Constructed")),
      rankCard("limited", a.rank && a.rank.limited, T("Limited")),
      a.mastery ? `<div class="mcard"><span class="seticon">${uiImg("xp", "mico") || A.setIcon(a.mastery.pass)}</span><div class="mt"><div class="rc-title">${T("Level")} ${a.mastery.level}<span class="next">→ ${a.mastery.level + 1}</span></div>${track(a.mastery.xp)}<div class="rc-sub">${T("Mastery")} ${A.esc(a.mastery.pass)}${a.mastery.xp != null ? " · " + a.mastery.xp + " / 1000 XP" : ""}${a.mastery.premium ? " · Premium" : ""}</div></div></div>` : "",
      ai ? `<div class="acard ${ai.claimable.size ? "claim" : ""}">${ring(ai.done, ai.total)}<div class="mt"><div class="rc-title">${T("Erfolge")}</div><div class="rc-sub">${[ai.claimable.size ? T("{n} abholbar", { n: ai.claimable.size }) : "", ai.inProgress ? T("{n} in Arbeit", { n: ai.inProgress }) : ""].filter(Boolean).join(" · ") || T("Alle erledigt")}</div></div></div>` : "",
    ].filter(Boolean).join("");
    // Wallet wie die Navigationsleiste: Wildcards (Symbol + Summe, Liste beim Überfahren), Münzen, Edelsteine
    const wcTip = `<b>${wc.c || 0} Common</b><br><b>${wc.u || 0} Uncommon</b><br><b>${wc.r || 0} Rare</b><br><b>${wc.m || 0} Mythic</b><br><span class="gold">${T("Tresor")}: ${A.num(a.vault, 1)} %</span>`;
    const wallet = a.gems != null || a.wildcards ? `<div class="wallet game">${(a.boosters || []).reduce((s, b) => s + (b.count || 0), 0) ? `<span class="wal bst" data-tip="${A.esc(`<b>${T("Booster")}</b><br>${a.boosters.filter((b) => b.count).map((b) => `${A.esc(A.setName ? A.setName(b.set) || b.set : b.set)} · ${b.count}×`).join("<br>")}`)}"><span class="bst-stack">${Array.from({ length: Math.min(3, a.boosters.reduce((s, b) => s + (b.count || 0), 0)) }, () => `<img src="assets/booster-pack.png" alt="">`).join("")}</span><b>${A.num(a.boosters.reduce((s, b) => s + (b.count || 0), 0))}</b></span>` : ""}<span class="wal wcs" data-tip="${A.esc(wcTip)}">${uiImg("wc_m")}</span>${a.vault != null ? `<span class="wal" title="${T("Tresor")}${a.orbs ? " · " + T("{n} Orbs", { n: a.orbs }) : ""}">${uiImg("vault")}<b>${A.num(a.vault, 1)} %</b></span>` : ""}<span class="wal" title="${T("Gold")}">${uiImg("coins")}<b>${a.gold == null ? "?" : A.num(a.gold)}</b></span><span class="wal" title="${T("Edelsteine")}">${uiImg("gems")}<b>${A.num(a.gems)}</b></span></div>` : "";
    const season = a.season && a.season.ordinal ? T("Saison {n} · endet {d}", { n: a.season.ordinal, d: A.fmtDate(a.season.end) }) : "";
    const meta = [T("{n} Matches", { n: s.n }) + " " + (range ? T("in den letzten {n} Tagen", { n: range }) : T("insgesamt")), s.n ? "Ø " + A.num(s.avgTurns, 1) + " " + T("Züge") : "", s.n ? "Ø " + A.fmtDur(s.avgDur) : "", streak].filter(Boolean);
    A.$("#hero").innerHTML = `${uiImg("logo", "ph-logo")}
      <div class="ph-top">
        <div class="avatar-ring sm ${s.n ? (s.rate >= .5 ? "good" : "bad") : ""}"><svg viewBox="0 0 88 88"><circle class="t" cx="44" cy="44" r="38"/><circle class="p" cx="44" cy="44" r="38" style="stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${off.toFixed(1)}"/></svg><div class="avatar">${A.esc(player.slice(0, 1).toUpperCase())}</div></div>
        <div class="ph-id"><div class="name">${A.esc(player)}</div><div class="meta">${[season, a.takenAt ? T("Stand") + " " + A.fmtDate(a.takenAt) + " " + A.fmtTime(a.takenAt) : ""].filter(Boolean).join(" · ")}</div></div>
        ${wallet}
      </div>
      <div class="ph-match">
        <div class="mc win"><b>${s.w}</b><span>${T("Siege")}</span></div>
        <div class="mbar"><div class="wlbar"><i class="w" style="width:${(s.n ? s.rate * 100 : 50).toFixed(1)}%"></i><span class="pct">${s.n ? Math.round(s.rate * 100) + " %" : "–"}</span></div>
          <div class="form">${list.slice(0, 20).reverse().map((m) => `<div class="d ${isW(m) ? "w" : isL(m) ? "l" : ""}" data-id="${A.esc(m.matchId)}"></div>`).join("")}</div>
          <div class="mmeta">${meta.map((x) => `<span>${x}</span>`).join("")}</div></div>
        <div class="mc loss"><b>${s.l}</b><span>${T("Niederlagen")}</span></div>
      </div>
      <div class="ph-cards">${cards || `<div class="muted small">${T("Konto")}: ${T("nicht im Protokoll")}</div>`}</div>`;
    A.$$("#hero .wal[data-tip]").forEach((d) => { d.addEventListener("mousemove", (ev) => A.tooltip(true, d.dataset.tip, ev)); d.addEventListener("mouseleave", () => A.tooltip(false)); });
    // Serien-Punkte: Match wie in der Deck-Detailansicht, Klick öffnet das Replay
    A.$$("#hero .form .d[data-id]").forEach((d) => {
      const m = list.find((x) => x.matchId === d.dataset.id);
      if (!m) return;
      const html = `<div class="mtip"><div class="mtip-h"><span class="when">${A.esc(A.relDate(m.start))} · ${A.fmtTime(m.start)}</span>${A.resultBadge(m.result)}</div>${A.deckCell(m)}<div class="mtip-r"><span>vs&nbsp;<b>${A.esc(m.opponent)}</b>${m.opponentPlatform ? ` <span class="muted">${A.esc(m.opponentPlatform)}</span>` : ""}</span><span class="muted">${m.turns} ${T("Züge")} · ${A.fmtDur(m.durationSec)}</span></div><div class="mtip-f">${A.FI.play || "▶"} ${T("Klicken für Replay")}</div></div>`;
      d.addEventListener("mousemove", (ev) => A.tooltip(true, html, ev));
      d.addEventListener("mouseleave", () => A.tooltip(false));
      d.addEventListener("click", () => { A.tooltip(false); location.href = "replay.html?id=" + encodeURIComponent(m.matchId); });
    });
  }

  /** Quest-Band: Tagesquests mit Fortschrittsbalken und Belohnung, dazu abholbare und fast fertige Erfolge */
  function renderQuests() {
    const a = D.account, el = A.$("#quests");
    if (!a) { el.innerHTML = ""; return; }
    const ai = achInfo(a);
    // Belohnung wie im Spiel: rundes Medaillon mit Fortschrittsbogen, Belohnungsgrafik und Goldbetrag darüber
    const qMedal = (q) => {
      const f = q.goal ? Math.max(0, Math.min(1, q.progress / q.goal)) : 0, c = 2 * Math.PI * 25;
      const gold = q.reward && q.reward.gold, xpOnly = !gold && q.reward && q.reward.xp;
      const img = uiImg("xp", "qm-img");
      return `<div class="qmedal ${xpOnly ? "xp" : ""}" title="${gold ? A.num(gold) + " " + T("Gold") : ""}${q.reward && q.reward.xp ? (gold ? " · " : "") + A.num(q.reward.xp) + " XP" : ""}"><svg viewBox="0 0 56 56"><circle class="t" cx="28" cy="28" r="25"/><circle class="p" cx="28" cy="28" r="25" style="stroke-dasharray:${c.toFixed(1)};stroke-dashoffset:${(c * (1 - f)).toFixed(1)}"/></svg>${xpOnly ? '<span class="qm-xp">XP</span>' : img}${gold ? `<span class="qm-n">${gold}</span>` : ""}</div>`;
    };
    const quests = (a.quests || []).map((q) => {
      const done = q.goal && q.progress >= q.goal;
      return `<div class="qcard ${done ? "done" : ""}">${qMedal(q)}<div class="qt"><b>${A.esc(q.name)}</b>${bar(q.goal ? q.progress / q.goal : 0, "gold")}<span class="muted small">${q.progress} / ${q.goal}${done ? " · " + T("erledigt") : ""}${q.reward && q.reward.xp ? " · " + A.num(q.reward.xp) + " XP" : ""}</span></div></div>`;
    });
    const achs = ai ? ai.open.filter((x) => ai.claimable.has(x.id) || ai.close.has(x.id)).slice(0, 6).map((x) => `<div class="qcard qach ${ai.claimable.has(x.id) ? "claim" : ""}">${uiImg(ai.claimable.has(x.id) ? "check" : "hourglass", "qico") || `<span class="qico ph">${FI.trophy}</span>`}${rewardIcon(x, "qrew")}<div class="qt"><b>${x.group === "Colors" ? uiImg(questIcon(ai.nice(x.id)), "amana") : ""}${A.esc(ai.nice(x.id))}</b><span class="muted small">${T("Erfolg")} · ${T(x.group === "Colors" ? "Farben" : "Kern")} · <em>${ai.claimable.has(x.id) ? T("abholbar") : T("fast fertig")}</em></span></div></div>`) : [];
    if (!quests.length && !achs.length) { el.innerHTML = ""; return; }
    const daily = a.rewards && a.rewards.dailyReset ? hoursUntil(a.rewards.dailyReset) : null, weekly = a.rewards && a.rewards.weeklyReset ? hoursUntil(a.rewards.weeklyReset) : null;
    el.innerHTML = `<div class="qb-head"><h2>${T("Tagesquests")} <span class="cnt">${quests.length}</span></h2><span class="muted small">${[daily != null ? T("Tagesreset in {h} h", { h: daily }) : "", weekly != null ? T("Wochenreset in {h} h", { h: weekly }) : ""].filter(Boolean).join(" · ")}</span></div>
      <div class="qcards">${quests.join("")}${achs.join("")}</div>`;
  }

  /** Konto-Details (eingeklappt): Booster und alle offenen Erfolge */
  function renderAccount() {
    const a = D.account, el = A.$("#account");
    if (!a) { el.innerHTML = ""; return; }
    const ai = achInfo(a);
    const achHtml = ai ? ai.open.map((x) => `<div class="ach ${ai.claimable.has(x.id) ? "claim" : ""}">${rewardIcon(x)}<b>${x.group === "Colors" ? uiImg(questIcon(ai.nice(x.id)), "amana") : ""}${A.esc(ai.nice(x.id))}</b><span class="muted small">${T(x.group === "Colors" ? "Farben" : "Kern")}${ai.claimable.has(x.id) ? ` · <em>${T("abholbar")}</em>` : ai.close.has(x.id) ? " · " + T("fast fertig") : ""}${x.progress != null ? " · " + T("Fortschritt {n}", { n: x.progress }) : ""}</span></div>`).join("") : "";
    const boosters = false ? `<div class="quests"><div class="ds-t">${T("Booster")}</div><div class="quest"><b>${a.boosters.reduce((s, b) => s + b.count, 0)}</b><span class="muted small">${a.boosters.slice(0, 8).map((b) => A.esc(b.set) + " ×" + b.count).join(", ")}</span></div></div>` : "";
    if (!achHtml && !boosters) { el.innerHTML = ""; return; }
    el.innerHTML = `<h2 class="fold-h2" id="h-account">${T("Konto")} <span class="muted small" style="text-transform:none;letter-spacing:0">${ai ? T("Erfolge") + " " + ai.done + " / " + ai.total : ""}</span></h2>
      <div id="account-body">${boosters}${ai ? `<div class="achs"><div class="ds-t">${T("Erfolge")} <span class="muted small" style="text-transform:none;letter-spacing:0">${ai.done} / ${ai.total}</span></div>${achHtml || `<div class="muted small">${T("Alle erledigt")}</div>`}</div>` : ""}</div>`;
    A.foldable(A.$("#h-account"), A.$("#account-body"), "index-account-details", false);   // standardmäßig zu: die Diagramme folgen direkt
  }
  function render() {
    const list = filtered().sort((a, b) => b.start - a.start);
    const chrono = [...list].reverse();
    const s = A.stats(list);
    const streak = (() => { let n = 0, t = list[0] && list[0].result; for (const m of list) { if (m.result === t) n++; else break; } return t ? T("{n}× {r} in Folge", { n, r: T(t) }) : ""; })();
    renderProfile(s, list, streak);

    const onPlay = list.filter((m) => m.onPlay === true), onDraw = list.filter((m) => m.onPlay === false);
    const sp = A.stats(onPlay), sd = A.stats(onDraw);

    renderQuests();
    renderAccount();
    // Verlauf: gleitende Winrate über 10 Matches
    const win = 10;
    const pts = chrono.map((m, i) => {
      const slice = chrono.slice(Math.max(0, i - win + 1), i + 1);
      const w = slice.filter(isW).length, l = slice.filter(isL).length;
      return { y: w + l ? w / (w + l) : 0.5, mark: isW(m) ? "win" : isL(m) ? "loss" : "", label: A.fmtDate(m.start).slice(0, 5),
        html: `<b>${A.fmtDate(m.start)} ${A.fmtTime(m.start)}</b> · ${A.esc(T(m.result))} vs&nbsp;${A.esc(m.opponent)}<br>${A.esc(A.deckLabel(m))}<br>${T("Winrate der letzten {n}", { n: slice.length })}: <b>${Math.round(100 * w / Math.max(1, w + l))} %</b> (${w}-${l})` };
    });
    A.lineChart(A.$("#chart-trend"), pts, { label: T("Winrate-Verlauf") });

    // pro Tag
    const byDay = A.groupBy(list, (m) => A.fmtDate(m.start));
    const days = [...byDay.entries()].sort((a, b) => a[1][0].start - b[1][0].start).map(([d, ms]) => ({
      label: d.slice(0, 5), title: d, w: ms.filter(isW).length, l: ms.filter(isL).length,
      html: `<b>${d}</b> · ${T("{n} Matches", { n: ms.length })}, ${ms.filter(isW).length}-${ms.filter(isL).length}<br>${[...ms].sort((a, b) => a.start - b.start).map(matchLine).join("")}`
    }));
    A.stackedBars(A.$("#chart-days"), days.slice(-31), { label: T("Matches pro Tag") });

    // Spiellänge
    const buckets = [["1–5", 1, 5], ["6–8", 6, 8], ["9–11", 9, 11], ["12–15", 12, 15], ["16+", 16, 999]];
    A.stackedBars(A.$("#chart-turns"), buckets.map(([label, lo, hi]) => { const ms = list.filter((m) => m.turns >= lo && m.turns <= hi); return {
      label, title: label + " " + T("Züge"), w: ms.filter(isW).length, l: ms.filter(isL).length,
      html: `<b>${label} ${T("Züge")}</b> · ${T("{n} Matches", { n: ms.length })}${ms.length ? `, ${T("Winrate")} ${Math.round(100 * ms.filter(isW).length / Math.max(1, ms.filter(isW).length + ms.filter(isL).length))} %` : ""}<br>${[...ms].sort((a, b) => b.start - a.start).slice(0, 6).map(matchLine).join("")}${ms.length > 6 ? `<div class="muted">+${ms.length - 6}</div>` : ""}` }; }), { label: T("Spiellänge"), height: 190 });

    // Spielbeginn
    A.$("#playdraw").innerHTML = [[T("Ich beginne"), sp], [T("Gegner beginnt"), sd]].map(([k, x]) => `<div class="box"><div class="k">${k}</div><div class="v">${x.n ? Math.round(x.rate * 100) + " %" : "–"}</div><div class="s">${T("{w} Siege · {l} Niederlagen", { w: x.w, l: x.l })}</div></div>`).join("");
    const hourOf = (m) => new Date(m.start).getHours();
    const slots = [[T("Morgen (6–12)"), 6, 12], [T("Nachmittag (12–18)"), 12, 18], [T("Abend (18–24)"), 18, 24], [T("Nacht (0–6)"), 0, 6]];
    A.rateRows(A.$("#rate-time"), slots.map(([label, lo, hi]) => { const ms = list.filter((m) => hourOf(m) >= lo && hourOf(m) < hi); return { label, w: ms.filter(isW).length, l: ms.filter(isL).length, tipHtml: `<b>${label}</b><br>${T("{n} Matches", { n: ms.length })}` }; }).filter((r) => r.w + r.l));

    A.rateRows(A.$("#rate-decks"), rateOf(A.groupBy(list, A.deckLabel), (m) => m.tile), { link: (r) => "decks.html?deck=" + encodeURIComponent(r.label), twoLine: true });
    A.rateRows(A.$("#rate-format"), rateOf(A.groupBy(list, (m) => m.format || A.eventLabel(m.eventId) || "?")));
    A.rateRows(A.$("#rate-platform"), rateOf(A.groupBy(list, (m) => m.opponentPlatform || "?")));
    // Handy: nur Liste, keine Replays (Zeilen nicht anklickbar)
    A.$("#recent tbody").innerHTML = list.slice(0, 10).map((m) => `<tr ${A.isMobile() ? "" : `class="clickable" onclick="location.href='replay.html?id=${m.matchId}'"`}>
      <td>${A.relDate(m.start)}<div class="muted small">${A.fmtTime(m.start)}</div></td><td>${A.resultBadge(m.result)}<div class="muted small">${A.esc(m.reason)}</div></td>
      <td>${A.deckCell(m)}</td><td><b>${A.esc(m.opponent)}</b><div class="muted small">${A.esc(m.opponentPlatform)}</div></td>
      <td>${A.esc(A.eventLabel(m.eventId))}</td><td>${m.turns}</td><td>${A.fmtDur(m.durationSec)}</td><td>${A.replayLink(m.matchId)}</td></tr>`).join("") ||
      `<tr><td colspan="8" class="empty">${T("Keine Matches im Zeitraum")}</td></tr>`;
    A.Art.bind(document.body);
  }
  render();
});
</script>
</body>
</html>
