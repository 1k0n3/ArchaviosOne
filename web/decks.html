<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTGA Stats · Decks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b0e18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</head>
<body>
<script>
App.load().then((D) => {
  const A = App, T = A.t;
  const ZONES = [["CommandZone", T("Commander")], ["Companions", T("Companion")], ["MainDeck", T("Deck")], ["Sideboard", T("Sideboard")]];
  A.shell("decks.html", `
    <div class="topbar"><div><h1>${T("Decks")}</h1><div class="sub" id="count"></div></div>
      <div class="right filters search-col"><div id="f-q"></div></div></div>
    <div class="topbar filters-bar"><div class="right filters"><div id="f-format"></div><div id="f-played"></div></div></div>
    <div id="detail"></div>
    <div class="deck-grid" id="list"></div>
  `);
  let onlyPlayed = false, onlyArchived = false, current = null;
  const FI = A.FI, relist = () => renderList();
  const fQ = A.searchBox(A.$("#f-q"), { placeholder: T("Deck oder Karte suchen"), onInput: A.debounce(relist, 150) });
  // Handy: Suche als fixierte Leiste unter den Filtern, direkt über den Decks
  if (A.isMobile()) { const lb = document.createElement("div"); lb.className = "lib-bar"; lb.append(A.$("#f-q")); A.$(".topbar.filters-bar").after(lb); }
  const fFormat = A.dropdown(A.$("#f-format"), { title: T("Format"), onChange: relist, items: [{ v: "", label: T("Alle Formate"), short: T("Format"), icon: FI.set }, ...[...new Set(D.decks.map((d) => d.format).filter(Boolean))].sort().map((f) => ({ v: f, label: f, icon: FI.set }))] });
  A.dropdown(A.$("#f-played"), { title: T("Nutzung"), onChange: (v) => { onlyPlayed = v === "1"; onlyArchived = v === "2"; renderList(); }, items: [{ v: "0", label: T("Alle Decks"), short: T("Alle"), icon: FI.all }, { v: "1", label: T("Nur gespielte"), short: T("Gespielte"), icon: FI.play }, ...(D.decks.some((d) => d.archived) ? [{ v: "2", label: T("Archiv (in Arena gelöscht)"), short: T("Archiv"), icon: FI.deck }] : [])] });

  const matchesOf = (d) => D.matches.filter((m) => (m.myDeckId && m.myDeckId === d.id) || (!m.myDeckId && m.myDeck === d.name));
  const commanderOf = (d) => (d.zones.CommandZone || []).map(([g]) => A.cardName(g)).join(", ");
  const label = (d) => { const c = commanderOf(d); return c ? `${d.name} · ${c}` : d.name; };
  const cardCount = (d) => (d.zones.MainDeck || []).reduce((s, [, q]) => s + q, 0);
  const deckText = (d) => ZONES.filter(([z]) => (d.zones[z] || []).length).map(([z, t]) => t + "\n" + d.zones[z].map(([g, q]) => { const c = A.card(g); return `${q} ${c.name} (${c.set}) ${c.nr}`; }).join("\n")).join("\n\n");

  function renderList() {
    const q = fQ.value.trim().toLowerCase();
    const list = D.decks.filter((d) => {
      if (fFormat.value && d.format !== fFormat.value) return false;
      if (onlyArchived ? !d.archived : d.archived) return false;   // Archiv nur auf Wunsch, sonst nur aktive Decks
      if (onlyPlayed && !matchesOf(d).length) return false;
      if (!q) return true;
      if (label(d).toLowerCase().includes(q)) return true;
      return Object.values(d.zones).some((z) => z.some(([g]) => A.cardName(g).toLowerCase().includes(q)));
    }).sort((a, b) => (matchesOf(b).length - matchesOf(a).length) || (b.lastUpdated || "").localeCompare(a.lastUpdated || ""));
    A.$("#count").textContent = T("{n} von {m} Decks", { n: list.length, m: D.decks.filter((d) => onlyArchived ? d.archived : !d.archived).length });
    A.$("#list").innerHTML = list.map((d) => {
      const s = A.stats(matchesOf(d));
      return A.deckBox(d, { cls: current === d.id ? "active" : "", sub: (d.archived ? T("Archiv") + " · " : "") + (commanderOf(d) || d.format || "") + (s.n ? ` · ${s.w}-${s.l}` : ""), badge: s.n ? `<span class="badge ${s.rate >= .5 ? "win" : "loss"} wr">${Math.round(s.rate * 100)} %</span>` : "" });
    }).join("") || `<div class="empty">${T("Keine Decks")}</div>`;
    A.$$(".deckbox").forEach((el) => {
      el.addEventListener("click", () => { A.tooltip(false); openDeck(el.dataset.id, true); });
      const d = D.decks.find((x) => x.id === el.dataset.id);
      el.addEventListener("mousemove", (ev) => { const s = A.stats(matchesOf(d)); A.tooltip(true, `<b>${A.esc(d.name)}</b><br>${A.esc(commanderOf(d) || "")}<br>${A.esc(d.format || "")} · ${T("{n} Karten", { n: cardCount(d) })}${s.n ? `<br>${T("{w} Siege, {l} Niederlagen", { w: s.w, l: s.l })} (${Math.round(s.rate * 100)} %)` : `<br><span class='muted'>${T("noch nicht gespielt")}</span>`}<br><span class="muted">${T("geändert {d}", { d: d.lastUpdated ? A.fmtDate(d.lastUpdated) : "?" })}</span>`, ev); });
      el.addEventListener("mouseleave", () => A.tooltip(false));
    });
    A.Art.bind(A.$("#list"));
  }

  // Ein Deck ist eine eigene Seite: Liste, Titel und Listensuche verschwinden, der Verlauf kennt Öffnen und Schließen
  const deckUrl = (d) => "decks.html?deck=" + encodeURIComponent(label(d));
  function openDeck(id, push) {
    current = id; const d = D.decks.find((x) => x.id === id);
    if (push && d) history.pushState({ deck: id }, "", deckUrl(d));
    renderDetail(); window.scrollTo({ top: 0 });
  }
  function closeDeck(push) {
    current = null;
    if (push) history.pushState({}, "", "decks.html");
    renderList(); renderDetail();
  }
  window.addEventListener("popstate", (ev) => { const id = ev.state && ev.state.deck; if (id && D.decks.some((x) => x.id === id)) openDeck(id, false); else closeDeck(false); });
  function renderDetail() {
    const d = D.decks.find((x) => x.id === current);
    const el = A.$("#detail");
    document.body.classList.toggle("deck-open", !!d);
    if (!d) { el.innerHTML = ""; return; }
    const ms = matchesOf(d).sort((a, b) => b.start - a.start);
    const s = A.stats(ms);
    const tile = (l, v, cls, sub) => `<div class="tile ${cls || ""}"><div class="label">${l}</div><div class="value">${v}</div>${sub ? `<div class="sub">${sub}</div>` : ""}</div>`;
    el.innerHTML = `<div class="deck-detail">
      <a class="back-link" id="back-decks" href="decks.html">${A.FI.chevron} ${T("Alle Decks")}</a>
      <div class="deck-head">
        ${A.deckBox(d, { cls: "sm", sub: commanderOf(d) })}
        <div class="info"><div class="t">${A.esc(d.name)}</div><div class="small muted">${A.esc(commanderOf(d))} · ${A.esc(d.format || "")} · ${T("{n} Karten", { n: cardCount(d) })} · ${T("zuletzt geändert {d}", { d: d.lastUpdated ? A.fmtDate(d.lastUpdated) : "?" })}${d.archived ? ` · <b>${T("in Arena gelöscht, archiviert am {d}", { d: d.archivedAt ? A.fmtDate(d.archivedAt) : "?" })}</b>` : ""}${d.fromMatch ? " · " + T("Deckliste aus dem letzten Match") : ""}</div>
          <div class="tiles stat-rows">${tile(T("Matches"), s.n)}${tile(T("Siege"), s.w, "win")}${tile(T("Niederlagen"), s.l, "loss")}${tile(T("Winrate"), s.n ? Math.round(s.rate * 100) + " %" : "–", s.n ? (s.rate >= .5 ? "win" : "loss") : "")}${tile(T("Ø Züge"), s.n ? s.avgTurns.toFixed(1) : "–")}${tile(T("Ø Dauer"), s.n ? A.fmtDur(s.avgDur) : "–")}</div></div>
        <div class="deck-side"><div class="col export"><h3>${T("Deckliste exportieren")}</h3>
          <div class="export-actions"><button class="primary small" id="copy-exp" title="${T("Arena-Importformat in die Zwischenablage")}">${A.FI.copies} ${T("Für Arena kopieren")}</button><button class="ghost small" id="save-exp" title="${T("Als Textdatei herunterladen")}">${A.FI.download} ${T("Als .txt speichern")}</button><button class="ghost small" id="toggle-exp">▾ ${T("Anzeigen")}</button><a class="ghost small edit-deck" href="builder.html?deck=${encodeURIComponent(d.id)}" title="${T("Im Deckbau bearbeiten")}">${A.FI.edit} ${T("Bearbeiten")}</a></div>
          <pre class="export collapsed" id="exp" title="${T("Klick zum Auf- und Zuklappen")}">${A.esc(deckText(d))}</pre></div>
        <div class="col matches"><h3>${T("Matches mit diesem Deck")}</h3>
          <table><tbody>${ms.slice(0, 6).map((m) => `<tr class="clickable" onclick="location.href='replay.html?id=${m.matchId}'"><td>${A.relDate(m.start)}</td><td>${A.resultBadge(m.result)}</td><td>${A.esc(m.opponent)}</td><td class="muted small">${m.turns} ${T("Züge")}</td><td class="play">${A.replayLink(m.matchId, true)}</td></tr>`).join("") || `<tr><td class="muted">${T("noch keine")}</td></tr>`}</tbody></table>
          ${ms.length > 6 ? `<a class="small" href="matches.html?deck=${encodeURIComponent(label(d))}">${T("alle {n} anzeigen →", { n: ms.length })}</a>` : ""}</div></div>
        ${A.deckStatsHtml(A.deckStats(d))}
        ${A.xButton("close")}
      </div>
      <div class="deck-tools-row">
      <div class="lib-bar"><div class="qcol"><div id="d-q"></div><span class="count" id="d-count"></span></div><div id="d-size"></div><div class="seg" id="view"></div></div>
      <div class="deck-toolbar filters"><div id="d-set"></div><div class="seg colors" id="d-colors" title="${T("Farbe")}"></div><div id="d-sort"></div><button type="button" class="reset" id="d-reset" title="${T("Filter und Sortierung zurücksetzen")}">${A.FI.reset}</button></div>
      </div>
      <div id="zones"></div></div>`;
    const expText = deckText(d);
    A.$("#copy-exp").addEventListener("click", (ev) => { navigator.clipboard.writeText(expText); ev.currentTarget.innerHTML = A.FI.check + " " + T("Kopiert"); });
    A.$("#save-exp").addEventListener("click", () => { const u = URL.createObjectURL(new Blob([expText], { type: "text/plain;charset=utf-8" })); const l = document.createElement("a"); l.href = u; l.download = d.name.replace(/[\/:*?"<>|]+/g, "_") + ".txt"; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); });
    // Export-Vorschau: Klick (ohne Textauswahl) klappt auf/zu, Knopf ebenso; Klick außerhalb oder Esc klappt wieder zu
    const exp = A.$("#exp"), expBtn = A.$("#toggle-exp");
    const setExp = (open) => { exp.classList.toggle("collapsed", !open); expBtn.innerHTML = open ? "▴ " + T("Einklappen") : "▾ " + T("Anzeigen"); };
    exp.addEventListener("click", () => { if (String(getSelection()).length) return; setExp(exp.classList.contains("collapsed")); });
    expBtn.addEventListener("click", () => setExp(exp.classList.contains("collapsed")));
    document.addEventListener("click", (ev) => { if (exp.isConnected && !exp.classList.contains("collapsed") && !ev.target.closest(".col.export")) setExp(false); });
    document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && exp.isConnected) setExp(false); });
    const zonesEl = A.$("#zones");
    // Hauptdeck nach Typen: Kreaturen, Zaubersprüche, andere bleibende Karten, Länder
    const TYPE_GROUPS = [[T("Kreaturen"), (c) => c.types.includes(2)], [T("Zaubersprüche"), (c) => c.types.includes(4) || c.types.includes(10)], [T("Bleibende Karten"), (c) => !c.isLand], [T("Länder"), () => true]];
    const sections = [];
    for (const [z, t] of ZONES) {
      const list = d.zones[z] || [];
      if (!list.length) continue;
      if (z !== "MainDeck") { sections.push([t, list, z]); continue; }
      const rest = [...list];
      for (const [name, test] of TYPE_GROUPS) { const hit = rest.filter(([g]) => test(A.card(g))); if (hit.length) sections.push([name, hit, z]); for (const x of hit) rest.splice(rest.indexOf(x), 1); }
    }
    let mode = "img", q = "", sortBy = "cmc", setF = "";
    const colorsF = new Set();
    const RAR_ORDER = { Mythic: 0, Rare: 1, Uncommon: 2, Common: 3, Standardland: 4, Token: 5 };
    // Nutzung aus den Matches (nach Kartennamen, über alle Drucke): Siege und gespielte Matches
    const use = new Map();
    for (const m of D.matches || []) { const seen = new Set(); for (const [g] of m.played || []) { const n = A.cardName(g); if (seen.has(n)) continue; seen.add(n); const x = use.get(n) || { w: 0, p: 0 }; x.p++; if (m.result === "Sieg") x.w++; use.set(n, x); } }
    const useOf = (c) => use.get(c.name) || { w: 0, p: 0 };
    const sorter = ([ga], [gb]) => {
      const a = A.card(ga), b = A.card(gb);
      const byName = a.name.localeCompare(b.name, "en");
      if (sortBy === "name") return byName;
      if (sortBy === "wins") return (useOf(b).w - useOf(a).w) || (useOf(b).p - useOf(a).p) || byName;
      if (sortBy === "played") return (useOf(b).p - useOf(a).p) || byName;
      if (sortBy === "rarity") return ((RAR_ORDER[a.rarity] ?? 9) - (RAR_ORDER[b.rarity] ?? 9)) || byName;
      if (sortBy === "set") return a.set.localeCompare(b.set) || String(a.nr).localeCompare(String(b.nr), undefined, { numeric: true });
      return (A.cmcOf(a.cost) - A.cmcOf(b.cost)) || byName; // Manawert
    };
    const allEntries = Object.values(d.zones).flat();
    const setsInDeck = [...new Set(allEntries.map(([g]) => A.card(g).set))].filter(Boolean).sort();
    const colorsInDeck = ["w", "u", "b", "r", "g"].filter((k) => allEntries.some(([g]) => A.card(g).colors.includes(k)));
    const hasColorless = allEntries.some(([g]) => { const c = A.card(g); return !c.colors.length && !c.isLand; });
    // Commander: kein eigener Abschnitt, sondern hervorgehoben als erste Karte im ersten Abschnitt (Kreaturen)
    const cmdList = (sections.find((x) => x[2] === "CommandZone") || [null, []])[1];
    const mainSections = sections.filter((x) => x[2] !== "CommandZone");
    const match = ([g]) => {
      const c = A.card(g);
      if (q && !c.name.toLowerCase().includes(q)) return false;
      if (setF && c.set !== setF) return false;
      if (!A.colorMatch(colorsF, c.colors, c.isLand)) return false;
      return true;
    };
    const secHtml = ([t, list], m, withCmd) => {
      const shown = list.filter(match).sort(sorter), cmd = withCmd ? cmdList.filter(match) : []; // Commander bleibt unsortiert vorn
      if (!shown.length && !cmd.length) return "";
      const n = shown.reduce((s, [, q]) => s + q, 0);
      const cmdHtml = m === "img"
        ? cmd.map(([g]) => A.cardTile(g, { compact: false, cls: "cmdr" })).join("")
        : cmd.map(([g]) => { const c = A.card(g); return `<div class="cardline cmd"><span class="q">★</span><span>${A.esc(c.name)}</span><span class="badge unk">${T("Commander")}</span><span class="set" title="${A.esc(A.setName(c.set))}">${A.esc(c.set)} ${A.esc(c.nr)}</span></div>`; }).join("");
      // Commander steht als normale erste Kachel im Raster; seine Überschrift ist genau so breit wie seine Kachel(n)
      const titles = cmd.length && m === "img"
        ? `<div class="zone-titles"><div class="zone-title cmd" style="--n:${cmd.length}">${T("Commander")}</div>${shown.length ? `<div class="zone-title">${t} · ${n}</div>` : ""}</div>`
        : `<div class="zone-title">${cmd.length ? T("Commander") + " · " : ""}${t} · ${n}</div>`;
      return `<section class="zone-sec" data-zone="${A.esc(t)}">${titles}` +
        (m === "img" ? `<div class="cards zone-body">${cmdHtml}${shown.map(([g, q]) => A.cardTile(g, { qty: q, compact: false })).join("")}</div>`
          : `<div class="zone-body">` + cmdHtml + shown.map(([g, q]) => { const c = A.card(g); return `<div class="cardline"><span class="q">${q}</span><span>${A.esc(c.name)}</span><span class="set" title="${A.esc(A.setName(c.set))}">${A.esc(c.set)} ${A.esc(c.nr)}</span></div>`; }).join("") + `</div>`) + "</section>";
    };
    A.$("#d-reset").addEventListener("click", () => { q = ""; dq.value = ""; setF = ""; ddSet.value = ""; colorsF.clear(); A.$$("#d-colors button").forEach((b) => b.classList.remove("on")); sortBy = "cmc"; ddSort.value = "cmc"; draw(); });
    const draw = () => {
      A.$("#d-reset").classList.toggle("show", !!(q || setF || colorsF.size || sortBy !== "cmc"));
      zonesEl.className = mode === "img" ? "zones-flow" : "zones-list";
      { let n = 0; for (const [, list] of mainSections) for (const [, q] of list.filter(match)) n += q; n += cmdList.filter(match).length; A.$("#d-count").textContent = T("{n} Karten", { n }); }
      zonesEl.innerHTML = mainSections.map((x, k) => secHtml(x, mode, k === 0)).join("") || `<div class="empty">${T("Keine Karte passt zur Suche")}</div>`;
      A.Art.bind(zonesEl); A.bindCardImages(zonesEl); A.hoverPreview(zonesEl); A.cardLinks(zonesEl);
      // Abschnitte je Kartentyp einklappbar (Handy: nur der erste offen)
      A.$$(".zone-sec", zonesEl).forEach((sec, k) => { const head = A.$(".zone-titles, .zone-title", sec); const body = A.$(".zone-body", sec); if (head && body && body !== head) A.foldable(head, body, "deck-zone:" + sec.dataset.zone, !A.isMobile() || k === 0); });
    };
    { const fh = A.$(".deck-facts-head", el), fb = A.$(".deck-facts", el); if (fh && fb) A.foldable(fh, fb, "deck-facts", !A.isMobile()); }
    // Set-Filter nur mit Symbol (Sets aus diesem Deck), Farbfilter nur mit vorhandenen Farben, Sortierung wie in der Bibliothek
    const ddSet = A.dropdown(A.$("#d-set"), { title: T("Set"), searchable: setsInDeck.length > 8, onChange: (v) => { setF = v; draw(); }, items: [
      { v: "", label: T("Alle Sets"), short: "", icon: A.FI.set }, ...setsInDeck.map((c) => ({ v: c, label: c, short: "", title: A.setName(c), search: A.setName(c), icon: A.setIcon(c) }))] });
    A.$("#d-set").classList.add("icon-only", "sets");
    const colEl = A.$("#d-colors");
    const hasMulti = allEntries.some(([g]) => A.card(g).colors.length >= 2);
    colEl.innerHTML = [...colorsInDeck, ...(hasMulti ? ["m"] : []), "c"].map((k) => `<button type="button" data-v="${k}" class="c${k}" title="${T({ w: "Weiß", u: "Blau", b: "Schwarz", r: "Rot", g: "Grün", m: "Mehrfarbig", c: "Farblos" }[k])}">${A.filterIcon(k)}</button>`).join("");
    if (!colorsInDeck.length && !hasColorless) colEl.style.display = "none";
    A.$$("button", colEl).forEach((b) => b.addEventListener("click", () => { const v = b.dataset.v; if (colorsF.has(v)) colorsF.delete(v); else colorsF.add(v); b.classList.toggle("on", colorsF.has(v)); draw(); }));
    const ddSort = A.dropdown(A.$("#d-sort"), { title: T("Sortierung"), value: "cmc", defaultValue: "cmc", onChange: (v) => { sortBy = v; draw(); }, items: [
      { v: "cmc", label: T("Manawert"), short: T("Mana"), icon: A.FI.mana }, { v: "name", label: T("Name A–Z"), short: T("Name"), icon: A.FI.az },
      { v: "wins", label: T("Meiste Siege"), short: T("Siege"), icon: A.FI.trophy }, { v: "played", label: T("Meist gespielt"), short: T("Gespielt"), icon: A.FI.play },
      { v: "rarity", label: T("Seltenheit"), icon: A.FI.gem("#e0b654") }, { v: "set", label: T("Set und Nummer"), short: T("Set"), icon: A.FI.set }] });
    const dq = A.searchBox(A.$("#d-q"), { placeholder: T("Karte im Deck suchen"), onInput: A.debounce((v) => { q = v.trim().toLowerCase(); draw(); }, 150) });
    A.sizeSlider(A.$("#d-size"), el, "mtga-deck-tile-w", 90, 200);
    if (A.isMobile()) { A.$(".deck-toolbar", el).append(A.$("#d-set"), A.$("#d-sort"), A.$("#d-colors"), A.$("#d-reset")); A.$(".deck-toolbar", el).after(A.$(".lib-bar", el)); }   // Suche zuletzt, direkt über den Karten
    A.$("#view", el).remove();
    A.zoomMenu(A.$(".lib-bar", el), A.$("#d-size"), A.isMobile() ? A.$("#d-count") : null, { view: mode === "img" ? "grid" : "list", onView: (v) => { mode = v === "list" ? "list" : "img"; draw(); } });
    draw();
    A.Art.bind(el);
    A.$(".x-btn.close", el).addEventListener("click", () => closeDeck(true));
    A.$("#back-decks", el).addEventListener("click", (ev) => { ev.preventDefault(); closeDeck(true); });
    // Handy: Export und Matches hinter kleinen Knöpfen unter dem Titel
    if (A.isMobile()) {
      const info = A.$(".deck-head .info", el), side = A.$(".deck-side", el);
      info.insertAdjacentHTML("beforeend", `<div class="deck-mini"><button class="primary" id="mini-copy" title="${T("Für Arena kopieren")}">${A.FI.copies}</button><button class="ghost" id="mini-save" title="${T("Als .txt speichern")}">${A.FI.download}</button><button class="ghost wide" id="mini-matches" title="${T("Matches mit diesem Deck")}">${A.FI.play}<span class="n">${ms.length}</span></button><a class="ghost edit-deck" href="builder.html?deck=${encodeURIComponent(d.id)}" title="${T("Im Deckbau bearbeiten")}">${A.FI.edit}</a></div>`);
      A.$("#mini-copy", el).addEventListener("click", (ev) => { navigator.clipboard.writeText(expText); ev.currentTarget.innerHTML = A.FI.check; });
      A.$("#mini-save", el).addEventListener("click", () => A.$("#save-exp", el).click());
      A.$("#mini-matches", el).addEventListener("click", () => { side.classList.toggle("show"); if (side.classList.contains("show")) side.scrollIntoView({ behavior: "smooth", block: "start" }); });
    }
  }
  const pre = A.param("deck");
  if (pre) { const d = D.decks.find((x) => label(x) === pre || x.name === pre); if (d) { current = d.id; history.replaceState({ deck: d.id }, "", deckUrl(d)); } }
  renderList();
  renderDetail();
  // Set-Namen nachladen und die offene Deckansicht damit neu zeichnen
  A.loadSets().then(() => { if (current) renderDetail(); });
});
</script>
</body>
</html>
